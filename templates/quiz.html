* { box-sizing: border-box; }

body {

header {

.email-body {

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[c]);
}

function updateProgress() {
    const total = QUESTIONS.length;
    const number = currentIndex + 1;

    document.getElementById("questionCounter").textContent =
        `Question ${number} of ${total}`;

    document.getElementById("progressPercent").textContent =
        `${Math.round(number / total * 100)}%`;

    document.getElementById("progressFill").style.width =
        `${number / total * 100}%`;
}

function renderEmail(email) {
    return `
    <article class="email-card">
        <div class="email-heading">${escapeHTML(email.label || "EMAIL")}</div>
        <div class="email-content">

            <div class="email-field">
                <small>From</small>
                <strong>${escapeHTML(email.sender)}</strong>
            </div>

            <div class="email-field">
                <small>Email address</small>
                <strong>${escapeHTML(email.sender_email)}</strong>
            </div>

            <div class="email-field">
                <small>Received</small>
                <strong>${escapeHTML(email.timestamp)}</strong>
            </div>

            <div class="email-field">
                <small>Subject</small>
                <strong>${escapeHTML(email.subject)}</strong>
            </div>

            <div class="email-body">${escapeHTML(email.body)}</div>

            ${email.link ? `
                <div class="email-link">
                    <strong>Link:</strong><br>${escapeHTML(email.link)}
                </div>` : ""}

            ${email.attachment ? `
                <div class="email-link">
                    <strong>Attachment:</strong><br>${escapeHTML(email.attachment)}
                </div>` : ""}

        </div>
    </article>`;
}

function renderQuestion() {
    stopScenario();

    const q = QUESTIONS[currentIndex];

    questionCard.style.display = "block";
    scenarioCard.style.display = "none";

    updateProgress();

    document.getElementById("questionCategory").textContent =
        q.category || "PHISHING INVESTIGATION";

    document.getElementById("questionTitle").textContent =
        q.title || `Question ${currentIndex + 1}`;

    document.getElementById("questionDescription").textContent =
        q.scenario || "";

    document.getElementById("emailNote").textContent =
        q.email_note || "";

    const emailArea = document.getElementById("emailArea");

    if (q.comparison && Array.isArray(q.emails)) {
        emailArea.innerHTML =
            `<div class="email-grid">${q.emails.map(renderEmail).join("")}</div>`;
    } else {
        const email = {
            label: "EMAIL DETAILS",
            sender: q.sender,
            sender_email: q.sender_email,
            timestamp: q.timestamp,
            subject: q.subject,
            body: q.body || "",
            link: q.display_link,
            attachment: q.attachment
        };

        emailArea.innerHTML =
            `<div class="email-grid">${renderEmail(email)}</div>`;
    }

    const optionsArea = document.getElementById("optionsArea");
    optionsArea.innerHTML = "";

    (q.options || []).forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "answer";
        input.value = index;

        const span = document.createElement("span");
        span.textContent = option;

        input.addEventListener("change", () => {
            selectedAnswers[currentIndex] = index;
            continueButton.disabled = false;
            showAnswerFeedback(index);
        });

        label.append(input, span);
        optionsArea.appendChild(label);
    });

    const feedback = document.getElementById("answerFeedback");
    feedback.className = "answer-feedback";
    feedback.textContent = "";

    continueButton.disabled = true;
    continueButton.textContent =
        currentIndex === QUESTIONS.length - 1
            ? "Submit Assessment"
            : "Continue";
}

function showAnswerFeedback(selectedIndex) {
    const q = QUESTIONS[currentIndex];
    const feedback = document.getElementById("answerFeedback");

    document.querySelectorAll(".option").forEach((option, index) => {
        option.classList.remove("correct", "wrong");

        if (index === Number(q.correct)) {
            option.classList.add("correct");
        }

        if (index === selectedIndex && index !== Number(q.correct)) {
            option.classList.add("wrong");
        }
    });

    const isCorrect = selectedIndex === Number(q.correct);

    feedback.className =
        "answer-feedback " + (isCorrect ? "correct" : "wrong");

    feedback.innerHTML = `
        <strong>${isCorrect ? "Correct response" : "Not quite right"}</strong>
        <br>${escapeHTML(q.explanation || "")}
    `;
}

/* -------------------------------------

------------------------------------- */

function createBox(w,h,d,color,x,y,z, materialOptions={}) {
    const geometry = new THREE.BoxGeometry(w,h,d);
    const material = new THREE.MeshStandardMaterial({
        color,
        roughness: .7,
        metalness: .05,
        ...materialOptions
    });

    const mesh = new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z);
    scene.add(mesh);
    sceneObjects.push(mesh);
    return mesh;
}

function createSphere(radius,color,x,y,z) {
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius,24,16),
        new THREE.MeshStandardMaterial({color,roughness:.55})
    );
    mesh.position.set(x,y,z);
    scene.add(mesh);
    sceneObjects.push(mesh);
    return mesh;
}

function createCylinder(radiusTop,radiusBottom,height,color,x,y,z) {
    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop,radiusBottom,height,20),
        new THREE.MeshStandardMaterial({color,roughness:.65})
    );
    mesh.position.set(x,y,z);
    scene.add(mesh);
    sceneObjects.push(mesh);
    return mesh;
}

function createTextSprite(text,color="#ffffff") {
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "rgba(5,18,34,.88)";
    ctx.fillRect(0,0,512,128);

    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.strokeRect(4,4,504,120);

    ctx.fillStyle = color;
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(text).slice(0,27),256,64);

    const texture = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({map:texture,transparent:true})
    );

    sprite.scale.set(3.2,.8,1);
    return sprite;
}

function buildOffice() {
    sceneObjects = [];
    particles = [];

    scene.background = new THREE.Color(0x10243b);
    scene.fog = new THREE.Fog(0x10243b,12,28);

    // Office floor
    createBox(20,.25,15,0x253b50,0,-.2,0);

    // Back wall and side walls
    createBox(20,7,.25,0x18334e,0,3.3,-7);
    createBox(.25,7,15,0x173149,-10,3.3,0);
    createBox(.25,7,15,0x173149,10,3.3,0);

    // Window
    createBox(5,2.8,.12,0x28638a,-5,3.7,-6.8,{
        metalness:.3,
        roughness:.25
    });

    // Window dividers
    createBox(.07,2.8,.08,0x8bc9e9,-5,3.7,-6.7);
    createBox(5,.07,.08,0x8bc9e9,-5,3.7,-6.7);

    // Desk
    createBox(5,.25,2,0x704b35,0,1.55,-1);
    createBox(.22,1.5,.22,0x344b60,-2, .75,-1);
    createBox(.22,1.5,.22,0x344b60,2,.75,-1);
    createBox(.22,1.5,.22,0x344b60,-2,.75,.5);
    createBox(.22,1.5,.22,0x344b60,2,.75,.5);

    // Monitor stand
    createBox(.18,.7,.18,0x394e61,0,2,-1.4);

    // Monitor body
    createBox(3,2,.18,0x101b2a,0,3,-1.5);

    // Monitor screen
    monitorScreen = createBox(
        2.78,1.78,.025,0x10385a,0,3,-1.39,
        {emissive:0x07213a,emissiveIntensity:.9}
    );

    // Keyboard
    createBox(1.5,.08,.45,0x1c2b3b,0,1.75,-.15);

    // Mouse
    createSphere(.13,0x9baebe,1.05,1.78,-.2);

    // Coffee mug
    createCylinder(.15,.12,.35,0xd7e2e9,-1.8,1.83,-.1);

    // Character chair
    createBox(1.4,.2,1.1,0x263a54,0,.85,1.6);
    createBox(1.3,1.4,.18,0x263a54,0,1.6,2.1);

    // Character body
    character = new THREE.Group();

    const shirt = new THREE.Mesh(
        new THREE.BoxGeometry(1.15,1.35,.65),
        new THREE.MeshStandardMaterial({color:0x2674a9,roughness:.8})
    );
    shirt.position.set(0,2,0);
    character.add(shirt);

    // Head
    const head = new THREE.Mesh(
        new THREE.SphereGeometry(.42,24,24),
        new THREE.MeshStandardMaterial({color:0xd6a47f})
    );
    head.position.set(0,3.05,-.05);
    character.add(head);

    // Hair
    const hair = new THREE.Mesh(
        new THREE.SphereGeometry(.43,24,12,0,Math.PI*2,0,Math.PI/2),
        new THREE.MeshStandardMaterial({color:0x25242b})
    );
    hair.position.set(0,3.14,-.05);
    character.add(hair);

    // Arms
    const leftArm = new THREE.Mesh(
        new THREE.BoxGeometry(.27,.95,.3),
        new THREE.MeshStandardMaterial({color:0x2674a9})
    );
    leftArm.position.set(-.7,1.95,-.4);
    leftArm.rotation.z=-.35;
    character.add(leftArm);

    const rightArm = leftArm.clone();
    rightArm.position.x=.7;
    rightArm.rotation.z=.35;
    character.add(rightArm);

    character.position.set(0,0,1.15);
    scene.add(character);
    sceneObjects.push(character);

    // Overhead lights
    const light1 = new THREE.PointLight(0x80cfff,45,18);
    light1.position.set(-4,6,1);
    scene.add(light1);

    const light2 = new THREE.PointLight(0x3485c5,35,18);
    light2.position.set(5,5,-3);
    scene.add(light2);

    const ambient = new THREE.AmbientLight(0xffffff,1.15);
    scene.add(ambient);

    // Decorative floating particles
    for (let i=0;i<50;i++) {
        const particle = createSphere(
            .025,
            i%2 ? 0x49bfff : 0x9bdcff,
            (Math.random()-.5)*15,
            Math.random()*6,
            (Math.random()-.5)*10
        );
        particles.push(particle);
    }

    // Email panel
    emailPanel = createBox(
        2.7,1.65,.06,0x1c3b57,0,3.3,-.8
    );
    emailPanel.visible = false;

    // Warning symbol panel
    alertObject = createSphere(.32,0xff4242,2.5,4,-1);
    alertObject.visible = false;
}

function initialize3D() {
    if (!window.THREE) {
        document.getElementById("sceneStatus3D").textContent =
            "3D library unavailable";
        return false;
    }

    const canvas = document.getElementById("threeCanvas");
    const container = document.getElementById("sceneContainer");

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        48,
        container.clientWidth/container.clientHeight,
        .1,
        100
    );

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);

    renderer = new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        alpha:false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(container.clientWidth,container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    clock = new THREE.Clock();

    buildOffice();

    window.addEventListener("resize",resize3D);

    animate3D();

    return true;
}

function resize3D() {
    if (!renderer || !camera) return;

    const container = document.getElementById("sceneContainer");

    camera.aspect = container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(container.clientWidth,container.clientHeight);
}

function animate3D() {
    animationFrame = requestAnimationFrame(animate3D);

    const time = clock ? clock.getElapsedTime() : 0;

    if (character) {
        character.position.y = Math.sin(time*1.5)*.025;
    }

    particles.forEach((particle,i) => {
        particle.position.y += Math.sin(time+i)*.001;
        particle.rotation.y += .005;
    });

    if (emailPanel && emailPanel.visible) {
        emailPanel.position.y = 3.3 + Math.sin(time*2)*.06;
    }

    if (alertObject && alertObject.visible) {
        const pulse = 1 + Math.sin(time*5)*.13;
        alertObject.scale.setScalar(pulse);
    }

    if (renderer && scene && camera) {
        renderer.render(scene,camera);
    }
}

function clearSceneLabels() {
    const removable = [];

    scene.children.forEach(object => {
        if (object.userData.dynamicLabel) removable.push(object);
    });

    removable.forEach(object => scene.remove(object));
}

function addFloatingLabel(text,color,x,y,z) {
    const sprite = createTextSprite(text,color);
    sprite.position.set(x,y,z);
    sprite.userData.dynamicLabel = true;
    scene.add(sprite);
}

function show3DStage(stageIndex) {
    const q = QUESTIONS[currentIndex];
    const theme = THEMES[currentTheme];
    const stage = STAGES[stageIndex];

    document.getElementById("sceneKicker").textContent = stage.kicker;
    document.getElementById("sceneTitle").textContent =
        stageIndex === 0 ? theme.subject : stage.title;

    document.getElementById("sceneDescription").textContent =
        stageIndex === 0 ? theme.threat :
        stageIndex === 3 ? theme.action : stage.description;

    document.getElementById("sceneCaption").textContent =
        stage.caption;

    document.getElementById("sceneStatus3D").textContent =
        stageIndex < 2 ? "INCOMING EMAIL" :
        stageIndex === 2 ? "THREAT DETECTED" :
        stageIndex === 3 ? "SECURITY RESPONSE" :
        "THREAT CONTAINED";

    if (!scene) return;

    clearSceneLabels();

    // Stage 1: New email arrives
    if (stageIndex === 0) {
        emailPanel.visible = true;
        alertObject.visible = false;

        monitorScreen.material.color.set(0x12608a);
        monitorScreen.material.emissive.set(0x0c4a70);

        addFloatingLabel("NEW EMAIL RECEIVED","#83d8ff",0,4.35,-.65);

        camera.position.set(7,5.5,9);
        camera.lookAt(0,2.5,0);
    }

    // Stage 2: Inspect the sender
    if (stageIndex === 1) {
        emailPanel.visible = true;

        monitorScreen.material.color.set(0x174a72);
        addFloatingLabel("INSPECT SENDER","#ffffff",0,4.35,-.65);

        camera.position.set(4,4.2,7);
        camera.lookAt(0,2.8,-.5);
    }

    // Stage 3: Threat detection
    if (stageIndex === 2) {
        emailPanel.visible = true;
        alertObject.visible = true;

        monitorScreen.material.color.set(0x8a2424);
        monitorScreen.material.emissive.set(0x601010);

        addFloatingLabel("THREAT DETECTED","#ff7070",0,4.35,-.65);

        camera.position.set(3,4,6);
        camera.lookAt(0,2.7,-.5);
    }

    // Stage 4: Employee response
    if (stageIndex === 3) {
        alertObject.visible = true;

        monitorScreen.material.color.set(0x235d77);
        monitorScreen.material.emissive.set(0x16415e);

        addFloatingLabel("REPORTING INCIDENT","#8ee5ff",0,4.35,-.65);

        camera.position.set(6,5,8);
        camera.lookAt(0,2,0);
    }

    // Stage 5: Resolution
    if (stageIndex === 4) {
        alertObject.visible = false;
        emailPanel.visible = false;

        monitorScreen.material.color.set(0x168354);
        monitorScreen.material.emissive.set(0x0a603b);

        addFloatingLabel("THREAT CONTAINED","#7dffb1",0,4.35,-.65);

        camera.position.set(7,5.5,9);
        camera.lookAt(0,2,0);
    }
}

/* -------------------------------------
   SCENARIO PLAYBACK
------------------------------------- */

function playScenario() {
    currentTheme = getTheme(QUESTIONS[currentIndex]);

    questionCard.style.display = "none";
    scenarioCard.style.display = "block";

    sceneElapsed = 0;
    scenePlaying = true;
    sceneFinished = false;

    nextQuestionButton.disabled = true;

    document.getElementById("scenarioStatus").textContent =
        "3D simulation playing...";

    document.getElementById("scenarioTimer").textContent =
        "25 seconds";

    document.getElementById("sceneProgressFill").style.width = "0%";

    if (!renderer) {
        const success = initialize3D();

        if (!success) {
            document.getElementById("scenarioStatus").textContent =
                "3D rendering could not be started. You can skip this scene.";
        }
    }

    show3DStage(0);

    stopScenario();

    sceneTimer = setInterval(() => {
        sceneElapsed++;

        const remaining = 25-sceneElapsed;

        document.getElementById("scenarioTimer").textContent =
            remaining > 0 ? `${remaining} seconds` : "Completed";

        document.getElementById("sceneProgressFill").style.width =
            `${sceneElapsed/25*100}%`;

        const stageIndex = Math.min(
            Math.floor(sceneElapsed/5),4
        );

        if (sceneElapsed % 5 === 0 && sceneElapsed < 25) {
            show3DStage(stageIndex);
        }

        if (sceneElapsed >= 25) {
            finishScenario();
        }
    },1000);
}

function stopScenario() {
    if (sceneTimer) {
        clearInterval(sceneTimer);
        sceneTimer = null;
    }
}

function finishScenario() {
    stopScenario();

    scenePlaying = false;
    sceneFinished = true;

    show3DStage(4);

    document.getElementById("scenarioTimer").textContent = "Completed";
    document.getElementById("scenarioStatus").textContent =
        "Simulation completed.";

    document.getElementById("sceneProgressFill").style.width = "100%";

    nextQuestionButton.disabled = false;
}

function replayScenario() {
    if (scenePlaying) return;
    playScenario();
}

function skipScenario() {
    if (!scenePlaying && !sceneFinished) return;
    finishScenario();
}

/* -------------------------------------
   QUESTION NAVIGATION
------------------------------------- */

function proceed() {
    if (selectedAnswers[currentIndex] === undefined) return;

    if (currentIndex === QUESTIONS.length-1) {
        submitAssessment();
        return;
    }

    playScenario();
}

function nextQuestion() {
    if (!sceneFinished) return;

    stopScenario();

    currentIndex++;

    if (currentIndex >= QUESTIONS.length) {
        submitAssessment();
        return;
    }

    renderQuestion();
}

/* -------------------------------------
   SUBMISSION
------------------------------------- */

async function submitAssessment() {
    stopScenario();

    continueButton.disabled = true;
    nextQuestionButton.disabled = true;

    try {
        const response = await fetch("/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                attempt_id: ATTEMPT_ID,
                answers: selectedAnswers
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Submission failed.");
        }

        if (result.url) {
            window.location.href = result.url;
        } else {
            throw new Error("Results URL was not returned.");
        }

    } catch (error) {
        alert(error.message || "Unable to submit assessment.");
        continueButton.disabled = false;
        nextQuestionButton.disabled = false;
    }
}

/* -------------------------------------
   EVENTS
------------------------------------- */

continueButton.addEventListener("click",proceed);
nextQuestionButton.addEventListener("click",nextQuestion);

document.getElementById("replayButton")
    .addEventListener("click",replayScenario);

document.getElementById("skipButton")
    .addEventListener("click",skipScenario);

if (Array.isArray(QUESTIONS) && QUESTIONS.length > 0) {
    renderQuestion();
} else {
    questionCard.innerHTML =
        "<h2>No questions available. Contact the administrator.</h2>";
}
</script>
