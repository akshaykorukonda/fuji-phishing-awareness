
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness Assessment | Fuji Silvertech</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #eef8ff, #f4fbff, #eaf8f7);
    font-family: Arial, sans-serif;
    color: #24364b;
}

.quiz-wrapper {
    max-width: 1050px;
    margin: 30px auto;
    padding: 20px;
}

.top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.logo {
    max-width: 180px;
    max-height: 65px;
    object-fit: contain;
}

.set-label {
    background: #e0f2fe;
    color: #0876b9;
    padding: 10px 18px;
    border-radius: 30px;
    font-weight: bold;
}

.progress-section {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(40, 100, 140, 0.07);
    margin-bottom: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: bold;
}

.progress-track {
    height: 9px;
    background: #e7f0f7;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 10%;
    background: linear-gradient(90deg, #28a8d8, #21b6a8);
    border-radius: 20px;
    transition: width 0.3s ease;
}

.question-card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(40, 100, 140, 0.08);
}

.category {
    display: inline-block;
    background: #e5f7f5;
    color: #078b83;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-bottom: 15px;
}

.question-title {
    font-size: 25px;
    line-height: 1.4;
    margin: 0 0 18px;
    color: #193b59;
}

.scenario-box {
    background: #f0f8ff;
    border-left: 4px solid #269bd0;
    padding: 18px;
    border-radius: 10px;
    line-height: 1.7;
    margin-bottom: 22px;
    color: #344b60;
}

.scenario-heading {
    font-size: 13px;
    font-weight: bold;
    color: #1685bd;
    margin-bottom: 7px;
    text-transform: uppercase;
}

.email-section {
    margin: 22px 0;
}

.email-heading {
    font-size: 16px;
    font-weight: bold;
    color: #234d70;
    margin-bottom: 12px;
}

.email-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.email-card {
    border: 1px solid #dce9f2;
    border-radius: 13px;
    overflow: hidden;
    background: #fbfdff;
    min-width: 0;
}

.email-card.single {
    max-width: 100%;
}

.email-top {
    padding: 13px 16px;
    background: #eaf5fc;
    border-bottom: 1px solid #dce9f2;
    font-weight: bold;
    color: #23658e;
}

.email-details {
    padding: 16px;
}

.email-row {
    display: flex;
    gap: 8px;
    margin-bottom: 9px;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.email-row strong {
    min-width: 75px;
    color: #526a7d;
}

.email-subject {
    font-size: 15px;
    font-weight: bold;
    color: #23445f;
    margin: 13px 0;
    overflow-wrap: anywhere;
}

.email-body {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 14px;
    color: #354b5e;
    border-top: 1px solid #e5edf3;
    padding-top: 13px;
}

.email-link {
    margin-top: 14px;
    padding: 11px;
    background: #fff5e9;
    border: 1px solid #f6dfc1;
    color: #9a5a16;
    border-radius: 7px;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.reply-to {
    color: #a14d4d;
}

.options-heading {
    margin: 28px 0 13px;
    font-size: 17px;
    color: #234d70;
    font-weight: bold;
}

.option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 16px;
    margin-bottom: 11px;
    border: 1px solid #dce8f0;
    border-radius: 12px;
    cursor: pointer;
    background: #fff;
    transition: 0.2s;
    line-height: 1.55;
}

.option:hover {
    border-color: #54acd5;
    background: #f3faff;
}

.option.selected {
    border-color: #1599cb;
    background: #eaf7ff;
}

.option input {
    margin-top: 4px;
    accent-color: #138fc4;
    transform: scale(1.15);
    flex-shrink: 0;
}

.option-letter {
    font-weight: bold;
    color: #1685bd;
    min-width: 20px;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.nav-button {
    border: none;
    border-radius: 9px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.previous {
    background: #e8f0f6;
    color: #35536a;
}

.next {
    background: #138fc4;
    color: white;
}

.submit {
    background: #13a58e;
    color: white;
}

.nav-button:hover {
    opacity: 0.88;
    transform: translateY(-1px);
}

.nav-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

.error-message {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 9px;
    color: #a52d2d;
    background: #fff0f0;
    border: 1px solid #ffd0d0;
}

.question-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 20px 0;
}

.question-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #d5e4ed;
    background: white;
    color: #587184;
    cursor: pointer;
    font-weight: bold;
}

.question-dot.active {
    background: #138fc4;
    color: white;
    border-color: #138fc4;
}

.question-dot.answered {
    background: #dff5ef;
    color: #087c69;
    border-color: #9edccc;
}

.question-dot.active.answered {
    background: #138fc4;
    color: white;
}

@media(max-width: 700px) {
    .quiz-wrapper {
        padding: 12px;
        margin: 12px auto;
    }

    .question-card {
        padding: 19px;
    }

    .question-title {
        font-size: 21px;
    }

    .email-grid {
        grid-template-columns: 1fr;
    }

    .navigation {
        flex-wrap: wrap;
    }

    .nav-button {
        padding: 12px 16px;
    }
}
</style>
</head>

<body>

<div class="quiz-wrapper">

    <header class="top-header">
        <img
            src="{{ url_for('static', filename='img/fuji-logo.png') }}"
            class="logo"
            alt="Fuji Silvertech"
        >

        <div class="set-label">
            Assessment Set {{ set_number }}
        </div>
    </header>

    <section class="progress-section">
        <div class="progress-info">
            <span id="questionCounter">Question 1 of 10</span>
            <span id="progressPercentage">10% Completed</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <div class="question-dots" id="questionDots"></div>

    <main class="question-card">

        <div id="questionContent">
            <p>Loading questions...</p>
        </div>

        <div class="navigation">
            <button
                type="button"
                class="nav-button previous"
                id="previousButton"
                onclick="previousQuestion()"
            >
                ← Previous
            </button>

            <button
                type="button"
                class="nav-button next"
                id="nextButton"
                onclick="nextQuestion()"
            >
                Next →
            </button>

            <button
                type="button"
                class="nav-button submit"
                id="submitButton"
                onclick="submitQuiz()"
                style="display:none"
            >
                Submit Assessment ✓
            </button>
        </div>

        <div class="error-message" id="errorMessage"></div>

    </main>

</div>

<script>
const QUESTIONS = {{ questions | tojson }};
const ATTEMPT_ID = {{ attempt_id | tojson }};
const SUBMIT_URL = {{ url_for('submit') | tojson }};

let currentQuestion = 0;
let answers = {};

const questionContent = document.getElementById("questionContent");
const questionCounter = document.getElementById("questionCounter");
const progressPercentage = document.getElementById("progressPercentage");
const progressFill = document.getElementById("progressFill");
const questionDots = document.getElementById("questionDots");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const submitButton = document.getElementById("submitButton");
const errorMessage = document.getElementById("errorMessage");

function createElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    if (text !== undefined && text !== null) {
        element.textContent = String(text);
    }

    return element;
}

function addEmailCard(email, single = false) {
    const card = createElement(
        "div",
        "email-card" + (single ? " single" : "")
    );

    const top = createElement(
        "div",
        "email-top",
        email.label || "Message"
    );

    card.appendChild(top);

    const details = createElement("div", "email-details");

    function addRow(label, value, extraClass = "") {
        if (value === undefined || value === null || value === "") {
            return;
        }

        const row = createElement("div", "email-row");
        const heading = createElement("strong", "", label);
        const content = createElement("span", extraClass, value);

        row.appendChild(heading);
        row.appendChild(content);
        details.appendChild(row);
    }

    addRow("From:", email.sender);
    addRow("Address:", email.sender_email);
    addRow("To:", email.to);
    addRow("Reply-To:", email.reply_to, "reply-to");

    if (email.subject) {
        details.appendChild(
            createElement("div", "email-subject", email.subject)
        );
    }

    if (email.body) {
        details.appendChild(
            createElement("div", "email-body", email.body)
        );
    }

    if (email.link) {
        details.appendChild(
            createElement("div", "email-link", "Link / Attachment: " + email.link)
        );
    }

    card.appendChild(details);
    return card;
}

function renderEmails(question) {
    const section = createElement("section", "email-section");

    if (question.emails && Array.isArray(question.emails)) {
        section.appendChild(
            createElement("div", "email-heading", "Compare the two messages")
        );

        const grid = createElement("div", "email-grid");

        question.emails.forEach(email => {
            grid.appendChild(addEmailCard(email));
        });

        section.appendChild(grid);
        return section;
    }

    if (question.email) {
        section.appendChild(
            createElement(
                "div",
                "email-heading",
                question.email.label || "Message under review"
            )
        );

        section.appendChild(addEmailCard(question.email, true));
        return section;
    }

    return null;
}

function renderQuestion() {
    const question = QUESTIONS[currentQuestion];

    if (!question) {
        questionContent.textContent = "Question could not be loaded.";
        return;
    }

    questionContent.replaceChildren();

    const category = createElement(
        "div",
        "category",
        question.category || "ASSESSMENT"
    );

    const title = createElement(
        "h1",
        "question-title",
        question.title || ("Question " + (currentQuestion + 1))
    );

    questionContent.appendChild(category);
    questionContent.appendChild(title);

    // Scenario is displayed whether or not the question has an email.
    if (question.scenario) {
        const scenarioBox = createElement("div", "scenario-box");

        scenarioBox.appendChild(
            createElement("div", "scenario-heading", "Scenario")
        );

        scenarioBox.appendChild(
            createElement("div", "", question.scenario)
        );

        questionContent.appendChild(scenarioBox);
    }

    // Display email only when the question actually contains email data.
    const emailSection = renderEmails(question);

    if (emailSection) {
        questionContent.appendChild(emailSection);
    }

    questionContent.appendChild(
        createElement("div", "options-heading", "Choose the correct answer")
    );

    const optionsContainer = createElement("div", "options-container");

    if (!Array.isArray(question.options) || question.options.length === 0) {
        optionsContainer.appendChild(
            createElement("p", "", "No answer options are available.")
        );
    } else {
        question.options.forEach((option, index) => {
            const label = createElement("label", "option");

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "question_" + currentQuestion;
            radio.value = index;

            if (answers[currentQuestion] === index) {
                radio.checked = true;
                label.classList.add("selected");
            }

            radio.addEventListener("change", function() {
                answers[currentQuestion] = index;
                updateDots();
                updateOptionSelection();
            });

            const letter = createElement(
                "span",
                "option-letter",
                String.fromCharCode(65 + index) + "."
            );

            const optionText = createElement(
                "span",
                "option-text",
                option
            );

            label.appendChild(radio);
            label.appendChild(letter);
            label.appendChild(optionText);

            optionsContainer.appendChild(label);
        });
    }

    questionContent.appendChild(optionsContainer);

    updateNavigation();
    updateProgress();
    updateDots();
}

function updateOptionSelection() {
    document.querySelectorAll(".option").forEach(option => {
        const radio = option.querySelector("input");

        option.classList.toggle("selected", radio.checked);
    });
}

function updateNavigation() {
    previousButton.disabled = currentQuestion === 0;

    const isLast = currentQuestion === QUESTIONS.length - 1;

    nextButton.style.display = isLast ? "none" : "inline-block";
    submitButton.style.display = isLast ? "inline-block" : "none";
}

function updateProgress() {
    const total = QUESTIONS.length;
    const percentage = Math.round(((currentQuestion + 1) / total) * 100);

    questionCounter.textContent =
        "Question " + (currentQuestion + 1) + " of " + total;

    progressPercentage.textContent = percentage + "% Completed";
    progressFill.style.width = percentage + "%";
}

function updateDots() {
    questionDots.replaceChildren();

    QUESTIONS.forEach((question, index) => {
        const dot = createElement("button", "question-dot", index + 1);
        dot.type = "button";

        if (index === currentQuestion) {
            dot.classList.add("active");
        }

        if (answers[index] !== undefined) {
            dot.classList.add("answered");
        }

        dot.addEventListener("click", function() {
            currentQuestion = index;
            errorMessage.style.display = "none";
            renderQuestion();
        });

        questionDots.appendChild(dot);
    });
}

function nextQuestion() {
    if (answers[currentQuestion] === undefined) {
        showError("Please select an answer before continuing.");
        return;
    }

    if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion++;
        errorMessage.style.display = "none";
        renderQuestion();
    }
}

function previousQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        errorMessage.style.display = "none";
        renderQuestion();
    }
}

function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
    errorMessage.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

async function submitQuiz() {
    const unanswered = [];

    QUESTIONS.forEach((question, index) => {
        if (answers[index] === undefined) {
            unanswered.push(index + 1);
        }
    });

    if (unanswered.length > 0) {
        currentQuestion = unanswered[0] - 1;
        renderQuestion();

        showError(
            "Please answer all questions before submitting. Unanswered question: " +
            unanswered.join(", ")
        );

        return;
    }

    const confirmed = window.confirm(
        "Are you sure you want to submit your assessment? You cannot change your answers after submission."
    );

    if (!confirmed) {
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    errorMessage.style.display = "none";

    try {
        const response = await fetch(SUBMIT_URL, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                attempt_id: ATTEMPT_ID,
                answers: QUESTIONS.map((question, index) => answers[index])
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || data.message || "Submission failed.");
        }

        if (!data.url) {
            throw new Error("The server did not return a result page URL.");
        }

        window.location.assign(data.url);

    } catch (error) {
        showError(error.message || "Something went wrong. Please try again.");

        submitButton.disabled = false;
        submitButton.textContent = "Submit Assessment ✓";
    }
}

// Check that the question data has loaded.
if (!Array.isArray(QUESTIONS) || QUESTIONS.length !== 10) {
    questionContent.textContent =
        "Unable to load the 10 assessment questions. Please contact support.";
} else {
    renderQuestion();
}
</script>

</body>
</html>
