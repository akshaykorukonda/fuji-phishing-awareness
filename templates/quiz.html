
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness | Fuji Silvertech</title>

<link rel="stylesheet" href="/static/style.css">

<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #2785c7;
    --dark-blue: #17669f;
    --teal: #20b7ae;
    --light-blue: #eaf6ff;
    --text: #24364b;
    --muted: #718096;
    --border: #dce9f3;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #edf8ff, #f7fcff);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
}

.container {
    width: min(950px, 94%);
    margin: 30px auto;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 5px 25px rgba(35, 105, 150, .08);
    margin-bottom: 22px;
}

.logo {
    width: 175px;
    max-height: 65px;
    object-fit: contain;
}

.header-right {
    text-align: right;
}

.header-right strong {
    display: block;
    color: var(--dark-blue);
}

.header-right span {
    font-size: 13px;
    color: var(--muted);
}

.quiz-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 35px rgba(35, 105, 150, .09);
}

.top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

.set-label {
    background: #e5f5ff;
    color: #17669f;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.question-count {
    color: var(--muted);
    font-size: 14px;
}

.progress-track {
    width: 100%;
    height: 9px;
    background: #eaf1f6;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2785c7, #20b7ae);
    border-radius: 20px;
    transition: width .3s ease;
}

.category {
    color: #159e9a;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.question-title {
    font-size: 24px;
    line-height: 1.4;
    margin: 0 0 18px;
}

.scenario {
    background: #f0f9ff;
    border-left: 4px solid var(--blue);
    border-radius: 10px;
    padding: 17px;
    margin: 18px 0;
    line-height: 1.6;
    white-space: pre-wrap;
}

.email-card {
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    margin: 18px 0;
    background: #fff;
}

.email-heading {
    padding: 13px 17px;
    background: #f1f8fd;
    font-weight: bold;
    color: var(--dark-blue);
    border-bottom: 1px solid var(--border);
}

.email-content {
    padding: 17px;
}

.email-row {
    margin-bottom: 10px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.email-row strong {
    display: inline-block;
    min-width: 75px;
    color: #526579;
}

.email-message {
    margin-top: 15px;
    padding-top: 14px;
    border-top: 1px solid #e8eef3;
    line-height: 1.6;
    white-space: pre-wrap;
}

.comparison-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
    margin: 18px 0;
}

.comparison-label {
    font-size: 13px;
    color: var(--dark-blue);
    font-weight: bold;
    margin-bottom: 8px;
}

.options {
    display: grid;
    gap: 12px;
    margin-top: 22px;
}

.option {
    display: flex;
    gap: 13px;
    align-items: flex-start;
    padding: 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: .2s;
    line-height: 1.5;
}

.option:hover {
    border-color: var(--blue);
    background: #f5fbff;
    transform: translateY(-1px);
}

.option.selected {
    border-color: var(--blue);
    background: #eaf6ff;
}

.option input {
    margin-top: 4px;
    accent-color: var(--blue);
    flex-shrink: 0;
}

.option-letter {
    font-weight: bold;
    color: var(--blue);
    min-width: 22px;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 30px;
}

.nav-button {
    border: 0;
    border-radius: 10px;
    padding: 13px 23px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.previous {
    background: #edf3f8;
    color: #526579;
}

.next {
    background: var(--blue);
    color: white;
}

.submit {
    background: var(--teal);
    color: white;
}

.nav-button:hover {
    filter: brightness(.96);
    transform: translateY(-1px);
}

.nav-button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

.question-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 25px;
    justify-content: center;
}

.dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #d8e6f0;
    background: white;
    color: #62758a;
    cursor: pointer;
    font-weight: bold;
}

.dot.current {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
}

.dot.answered {
    background: #d9f6ee;
    color: #12866d;
    border-color: #b5e8d9;
}

.footer {
    text-align: center;
    color: #8494a5;
    font-size: 12px;
    padding: 20px;
}

.error-message {
    display: none;
    background: #fff0f0;
    border: 1px solid #ffd1d1;
    color: #b42318;
    border-radius: 10px;
    padding: 12px;
    margin-top: 15px;
}

@media(max-width: 650px) {
    .container {
        width: 96%;
        margin: 12px auto;
    }

    .header {
        padding: 14px;
    }

    .logo {
        width: 130px;
    }

    .quiz-card {
        padding: 19px;
    }

    .question-title {
        font-size: 20px;
    }

    .comparison-grid {
        grid-template-columns: 1fr;
    }

    .nav-button {
        padding: 12px 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <img
            src="/static/img/fuji-logo.png"
            class="logo"
            alt="Fuji Silvertech"
        >

        <div class="header-right">
            <strong>Security Awareness</strong>
            <span>Phishing Assessment</span>
        </div>
    </header>

    <main class="quiz-card">

        <div class="top-line">
            <div class="set-label">
                ASSESSMENT SET {{ set_number }}
            </div>

            <div class="question-count" id="questionCount">
                Question 1 of 10
            </div>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="questionArea"></div>

        <div class="error-message" id="errorMessage"></div>

        <div class="navigation">
            <button
                class="nav-button previous"
                id="previousButton"
                type="button"
                onclick="previousQuestion()"
            >
                ← Previous
            </button>

            <button
                class="nav-button next"
                id="nextButton"
                type="button"
                onclick="nextQuestion()"
            >
                Next →
            </button>

            <button
                class="nav-button submit"
                id="submitButton"
                type="button"
                onclick="submitQuiz()"
                style="display:none"
            >
                Submit Assessment
            </button>
        </div>

        <div class="question-dots" id="questionDots"></div>

    </main>

    <footer class="footer">
        Fuji Silvertech | Information Security Awareness Program
    </footer>

</div>

<script>
"use strict";

const QUESTIONS = {{ questions | tojson }};
const ATTEMPT_ID = {{ attempt_id | tojson }};
const SUBMIT_URL = {{ url_for('submit') | tojson }};

let currentQuestion = 0;
const answers = new Array(QUESTIONS.length).fill(null);

const questionArea = document.getElementById("questionArea");
const questionCount = document.getElementById("questionCount");
const progressFill = document.getElementById("progressFill");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const submitButton = document.getElementById("submitButton");
const questionDots = document.getElementById("questionDots");
const errorMessage = document.getElementById("errorMessage");

function addText(parent, tag, className, value) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = value ?? "";
    parent.appendChild(element);
    return element;
}

function getValue(object, keys, fallback = "") {
    for (const key of keys) {
        if (object && object[key] !== undefined && object[key] !== null) {
            return object[key];
        }
    }
    return fallback;
}

function renderEmail(email, heading) {
    const card = document.createElement("div");
    card.className = "email-card";

    addText(card, "div", "email-heading", heading);

    const content = document.createElement("div");
    content.className = "email-content";

    const rows = [
        ["From", getValue(email, ["sender", "from"])],
        ["Address", getValue(email, ["sender_email", "from_email", "email"])],
        ["To", getValue(email, ["recipient", "to"])],
        ["Subject", getValue(email, ["subject", "title"])],
        ["Time", getValue(email, ["timestamp", "time"])]
    ];

    rows.forEach(([label, value]) => {
        if (!value) return;

        const row = document.createElement("div");
        row.className = "email-row";

        const strong = document.createElement("strong");
        strong.textContent = label + ":";

        const span = document.createElement("span");
        span.textContent = value;

        row.append(strong, span);
        content.appendChild(row);
    });

    const message = getValue(email, ["body", "message", "content", "email_body"]);

    if (message) {
        addText(content, "div", "email-message", message);
    }

    card.appendChild(content);
    return card;
}

function renderQuestion(index) {
    const question = QUESTIONS[index];

    questionArea.replaceChildren();
    errorMessage.style.display = "none";

    questionCount.textContent =
        `Question ${index + 1} of ${QUESTIONS.length}`;

    progressFill.style.width =
        `${((index + 1) / QUESTIONS.length) * 100}%`;

    const category = getValue(question, ["category"], "PHISHING AWARENESS");
    addText(questionArea, "div", "category", category);

    const title = getValue(
        question,
        ["title", "question", "text"],
        `Question ${index + 1}`
    );

    addText(questionArea, "h2", "question-title", title);

    const scenario = getValue(question, ["scenario", "description"]);

    if (scenario) {
        addText(questionArea, "div", "scenario", scenario);
    }

    if (Array.isArray(question.emails) && question.emails.length) {
        const comparison = document.createElement("div");
        comparison.className = "comparison-grid";

        question.emails.forEach((email, emailIndex) => {
            const wrapper = document.createElement("div");

            addText(
                wrapper,
                "div",
                "comparison-label",
                email.label || `Email ${emailIndex + 1}`
            );

            wrapper.appendChild(
                renderEmail(email, `Email ${emailIndex + 1}`)
            );

            comparison.appendChild(wrapper);
        });

        questionArea.appendChild(comparison);

    } else if (question.email && typeof question.email === "object") {
        questionArea.appendChild(
            renderEmail(question.email, "MESSAGE DETAILS")
        );

    } else if (question.sender_email || question.sender) {
        questionArea.appendChild(
            renderEmail(question, "MESSAGE DETAILS")
        );
    }

    const options = question.options || [];
    const optionsContainer = document.createElement("div");
    optionsContainer.className = "options";

    options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = `question-${index}`;
        radio.value = optionIndex;
        radio.checked = answers[index] === optionIndex;

        const letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = String.fromCharCode(65 + optionIndex) + ".";

        const text = document.createElement("span");
        text.textContent = typeof option === "string"
            ? option
            : getValue(option, ["label", "text", "value"], "");

        if (radio.checked) {
            label.classList.add("selected");
        }

        radio.addEventListener("change", () => {
            answers[index] = optionIndex;

            optionsContainer.querySelectorAll(".option").forEach(item => {
                item.classList.remove("selected");
            });

            label.classList.add("selected");
            updateDots();
        });

        label.append(radio, letter, text);
        optionsContainer.appendChild(label);
    });

    questionArea.appendChild(optionsContainer);

    previousButton.disabled = index === 0;

    const lastQuestion = index === QUESTIONS.length - 1;

    nextButton.style.display = lastQuestion ? "none" : "inline-block";
    submitButton.style.display = lastQuestion ? "inline-block" : "none";

    updateDots();
}

function updateDots() {
    questionDots.replaceChildren();

    QUESTIONS.forEach((question, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot";

        if (index === currentQuestion) {
            dot.classList.add("current");
        }

        if (answers[index] !== null) {
            dot.classList.add("answered");
        }

        dot.textContent = index + 1;

        dot.addEventListener("click", () => {
            currentQuestion = index;
            renderQuestion(currentQuestion);
        });

        questionDots.appendChild(dot);
    });
}

function previousQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion(currentQuestion);
    }
}

function nextQuestion() {
    if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion++;
        renderQuestion(currentQuestion);
    }
}

async function submitQuiz() {
    const unanswered = answers.findIndex(answer => answer === null);

    if (unanswered !== -1) {
        errorMessage.textContent =
            `Please answer Question ${unanswered + 1} before submitting.`;

        errorMessage.style.display = "block";

        currentQuestion = unanswered;
        renderQuestion(currentQuestion);
        errorMessage.textContent =
            `Please answer Question ${unanswered + 1} before submitting.`;
        errorMessage.style.display = "block";

        return;
    }

    const confirmed = confirm(
        "Are you sure you want to submit your assessment?"
    );

    if (!confirmed) return;

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    try {
        const response = await fetch(SUBMIT_URL, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                attempt_id: ATTEMPT_ID,
                answers: answers
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Unable to submit your assessment."
            );
        }

        if (data.url) {
            window.location.href = data.url;
        } else {
            window.location.href = "/result";
        }

    } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = "block";

        submitButton.disabled = false;
        submitButton.textContent = "Submit Assessment";
    }
}

if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {
    questionArea.textContent =
        "No questions are available. Please contact the administrator.";
    previousButton.disabled = true;
    nextButton.disabled = true;
    submitButton.disabled = true;
} else {
    renderQuestion(0);
}
</script>

</body>
</html>
