
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness Assessment | Fuji Silvertech</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #edf8ff, #e8f8f7);
    color: #19334a;
}

.page {
    max-width: 900px;
    margin: 35px auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.logo {
    max-width: 180px;
    max-height: 65px;
    object-fit: contain;
}

.header-info {
    text-align: right;
    color: #527087;
    font-size: 13px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 12px 35px rgba(39, 110, 150, .10);
    border: 1px solid #dceef7;
}

.topline {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: #4385a8;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
}

.progress-track {
    width: 100%;
    height: 9px;
    border-radius: 20px;
    background: #e7f0f5;
    overflow: hidden;
    margin-bottom: 28px;
}

.progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #299bd0, #25b9a6);
    transition: width .3s ease;
}

.question-title {
    font-size: 23px;
    line-height: 1.45;
    margin: 10px 0 22px;
}

.question-category {
    color: #168d9a;
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: bold;
    text-transform: uppercase;
}

.question-description {
    color: #668094;
    font-size: 14px;
    margin-bottom: 20px;
}

.options {
    display: grid;
    gap: 13px;
}

.option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 17px;
    border: 1.5px solid #dceaf2;
    border-radius: 13px;
    cursor: pointer;
    transition: .2s;
    background: #fbfdff;
}

.option:hover {
    border-color: #42a6ce;
    background: #f0faff;
}

.option.selected {
    border-color: #249fc0;
    background: #eaf9fc;
    box-shadow: 0 0 0 2px rgba(36,159,192,.08);
}

.option input {
    margin-top: 4px;
    accent-color: #159eac;
    width: 17px;
    height: 17px;
    flex-shrink: 0;
}

.option-text {
    line-height: 1.5;
    font-size: 15px;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 30px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.previous {
    background: #edf3f7;
    color: #476477;
}

.next, .submit {
    color: white;
    background: linear-gradient(100deg, #268fca, #20aaad);
}

.submit {
    background: linear-gradient(100deg, #159b8c, #24b69d);
}

.question-counter {
    color: #71899b;
    font-size: 13px;
    text-align: center;
    margin-top: 20px;
}

.message {
    display: none;
    padding: 14px;
    border-radius: 10px;
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
}

.message.error {
    display: block;
    color: #a32e37;
    background: #fff0f0;
    border: 1px solid #ffd2d2;
}

.message.info {
    display: block;
    color: #176b7c;
    background: #eafaff;
    border: 1px solid #c8edf5;
}

.footer {
    text-align: center;
    color: #8196a5;
    font-size: 12px;
    margin: 22px 0;
}

@media(max-width:600px) {
    .page { margin: 12px auto; padding: 12px; }
    .card { padding: 20px; }
    .question-title { font-size: 19px; }
    .header { align-items: flex-start; }
    .logo { max-width: 130px; }
    .navigation button { padding: 12px 15px; }
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <img
            class="logo"
            src="{{ url_for('static', filename='img/fuji-logo.png') }}"
            alt="Fuji Silvertech"
        >

        <div class="header-info">
            <strong>Phishing Awareness Assessment</strong><br>
            Set {{ set_number }}<br>
            {{ session.get('email', '') }}
        </div>
    </header>

    <main class="card">

        <div class="topline">
            <span>SECURITY AWARENESS</span>
            <span id="progressText">Question 1 of {{ questions|length }}</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="questionContainer"></div>

        <div id="message" class="message"></div>

        <div class="navigation">
            <button class="previous" id="previousBtn" type="button">
                Previous
            </button>

            <button class="next" id="nextBtn" type="button">
                Next
            </button>

            <button class="submit" id="submitBtn" type="button" hidden>
                Submit Assessment
            </button>
        </div>

        <div class="question-counter" id="questionCounter"></div>

    </main>

    <footer class="footer">
        Fuji Silvertech | Information Security Awareness
    </footer>

</div>

<script>
"use strict";

/* Data supplied by Flask */
const QUESTIONS = {{ questions | tojson }};
const ATTEMPT_ID = {{ attempt_id | tojson }};

const TOTAL = QUESTIONS.length;

let currentQuestion = 0;
let answers = Array(TOTAL).fill(null);
let submitting = false;

const container = document.getElementById("questionContainer");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const questionCounter = document.getElementById("questionCounter");


/* Escape text before inserting it into HTML */
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}


/* Determine whether a question is multi-select */
function isMultiSelect(question) {
    return ["find_mistakes", "click_errors"].includes(question.mode);
}


/* Display an error or information message */
function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
}


/* Hide messages */
function clearMessage() {
    message.textContent = "";
    message.className = "message";
}


/* Render the current question */
function renderQuestion() {

    const question = QUESTIONS[currentQuestion];

    if (!question) {
        showMessage("Question could not be loaded.");
        return;
    }

    clearMessage();

    const multi = isMultiSelect(question);
    const selected = answers[currentQuestion];

    let html = `
        <div class="question-category">
            ${escapeHTML(question.category || "PHISHING AWARENESS")}
        </div>

        <h2 class="question-title">
            ${escapeHTML(question.title || question.question || "Assessment Question")}
        </h2>
    `;

    if (question.description) {
        html += `
            <p class="question-description">
                ${escapeHTML(question.description)}
            </p>
        `;
    }

    if (multi) {
        html += `
            <p class="question-description">
                Select all the options that apply.
            </p>
        `;
    }

    html += `<div class="options">`;

    const options = Array.isArray(question.options)
        ? question.options
        : [];

    options.forEach((option, index) => {

        let value;
        let label;

        if (typeof option === "string") {
            value = String(index);
            label = option;
        } else {
            value = String(option.id ?? option.value ?? index);
            label = option.text ?? option.label ?? option.value ?? "";
        }

        const isSelected = multi
            ? Array.isArray(selected) && selected.map(String).includes(value)
            : selected !== null && String(selected) === String(index);

        html += `
            <label class="option ${isSelected ? "selected" : ""}">
                <input
                    type="${multi ? "checkbox" : "radio"}"
                    name="question_${currentQuestion}"
                    value="${escapeHTML(value)}"
                    ${isSelected ? "checked" : ""}
                >

                <span class="option-text">
                    ${escapeHTML(label)}
                </span>
            </label>
        `;
    });

    html += `</div>`;

    container.innerHTML = html;

    /* Handle answer selection */
    container.querySelectorAll("input").forEach(input => {

        input.addEventListener("change", () => {

            if (multi) {

                const selectedValues = Array.from(
                    container.querySelectorAll("input:checked")
                ).map(item => item.value);

                answers[currentQuestion] = selectedValues;

            } else {

                answers[currentQuestion] = Number(input.value);
            }

            container.querySelectorAll(".option").forEach(option => {
                option.classList.toggle(
                    "selected",
                    option.querySelector("input").checked
                );
            });

            clearMessage();
        });
    });

    previousBtn.disabled = currentQuestion === 0;

    const isLast = currentQuestion === TOTAL - 1;

    nextBtn.hidden = isLast;
    submitBtn.hidden = !isLast;

    progressText.textContent =
        `Question ${currentQuestion + 1} of ${TOTAL}`;

    progressFill.style.width =
        `${((currentQuestion + 1) / TOTAL) * 100}%`;

    questionCounter.textContent =
        `${answers.filter(answer => answer !== null).length} of ${TOTAL} questions answered`;
}


/* Move to the next question */
nextBtn.addEventListener("click", () => {

    if (currentQuestion < TOTAL - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
});


/* Move to the previous question */
previousBtn.addEventListener("click", () => {

    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
});


/* Convert answers into the format expected by app.py */
function prepareAnswers() {

    return QUESTIONS.map((question, index) => {

        const answer = answers[index];

        if (isMultiSelect(question)) {
            return Array.isArray(answer) ? answer : [];
        }

        return answer === null ? null : Number(answer);
    });
}


/* Submit the completed assessment */
async function submitAssessment() {

    if (submitting) return;

    const unanswered = answers
        .map((answer, index) => ({ answer, index }))
        .filter(item => {
            if (item.answer === null) return true;

            if (Array.isArray(item.answer)) {
                return item.answer.length === 0;
            }

            return false;
        });

    if (unanswered.length > 0) {

        const firstUnanswered = unanswered[0].index;

        const proceed = confirm(
            `${unanswered.length} question(s) are unanswered. ` +
            "Unanswered questions will receive zero marks. Submit anyway?"
        );

        if (!proceed) {
            currentQuestion = firstUnanswered;
            renderQuestion();
            return;
        }
    } else {

        const proceed = confirm(
            "Are you sure you want to submit your assessment?"
        );

        if (!proceed) return;
    }

    submitting = true;

    submitBtn.disabled = true;
    previousBtn.disabled = true;
    nextBtn.disabled = true;

    submitBtn.textContent = "Submitting...";

    showMessage("Saving your assessment. Please wait...", "info");

    try {

        const response = await fetch(
            "{{ url_for('submit') }}",
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    attempt_id: ATTEMPT_ID,
                    answers: prepareAnswers()
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error || "Unable to submit your assessment."
            );
        }

        if (!data.url) {
            throw new Error("Submission succeeded, but the result link was not received.");
        }

        showMessage("Assessment submitted successfully. Opening your results...", "info");

        window.location.assign(data.url);

    } catch (error) {

        console.error("Assessment submission error:", error);

        submitting = false;

        submitBtn.disabled = false;
        previousBtn.disabled = false;
        nextBtn.disabled = false;

        submitBtn.textContent = "Submit Assessment";

        showMessage(
            error.message || "Something went wrong. Please try again."
        );
    }
}


/* Submit button */
submitBtn.addEventListener("click", submitAssessment);


/* Initial page setup */
if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {

    showMessage("No questions were loaded. Please contact the administrator.");

    nextBtn.disabled = true;
    submitBtn.disabled = true;

} else {

    renderQuestion();
}
</script>

</body>
</html>
