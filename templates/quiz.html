
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness | Fuji Silvertech</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
    --blue:#328acb;
    --blue-dark:#216da8;
    --teal:#16a99b;
    --teal-dark:#10877d;
    --ink:#24445e;
    --muted:#71869a;
    --border:#dcebf3;
    --pale:#edf7fc;
}

body{
    margin:0;
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#f4fbff,#eaf6fc 55%,#f7fcff);
    color:var(--ink);
}

header{
    background:rgba(255,255,255,.96);
    padding:13px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 18px rgba(35,100,140,.08);
    border-bottom:1px solid #e3f0f6;
}

.logo{max-height:52px;max-width:190px;object-fit:contain}

.header-label{
    color:var(--teal-dark);
    font-size:12px;
    font-weight:850;
    letter-spacing:1.2px;
}

.container{
    max-width:1050px;
    margin:32px auto;
    padding:0 18px 50px;
}

.progress-card,.question-card,.scenario-card{
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(43,105,143,.08);
    border:1px solid rgba(214,233,244,.9);
}

.progress-card{padding:19px 23px;margin-bottom:21px}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:800;
    color:#46657d;
    margin-bottom:12px;
}

.progress-track{
    height:10px;
    background:#e8f2f7;
    border-radius:30px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    border-radius:30px;
    background:linear-gradient(90deg,#4c9cdd,#22b9a7);
    transition:width .5s ease;
}

.question-card{
    padding:30px;
    display:none;
    animation:fadeUp .45s ease;
}

.category{
    display:inline-block;
    background:#e5f6f6;
    color:#13877e;
    padding:8px 13px;
    border-radius:30px;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:15px;
}

.question-title{
    font-size:25px;
    color:#244b69;
    margin:0 0 12px;
    line-height:1.4;
}

.question-description{
    color:#71869a;
    font-size:14px;
    line-height:1.8;
    white-space:pre-line;
    margin-bottom:22px;
}

.email-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
    margin:20px 0;
}

.email-card{
    background:#fff;
    border:1px solid #dceaf2;
    border-radius:14px;
    overflow:hidden;
    min-width:0;
    box-shadow:0 4px 14px rgba(45,100,135,.04);
    transition:transform .2s,box-shadow .2s;
}

.email-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(45,100,135,.09);
}

.email-heading{
    padding:14px 17px;
    background:linear-gradient(110deg,#eaf5ff,#e7f8f6);
    border-bottom:1px solid #dceaf2;
    font-size:12px;
    font-weight:900;
    color:#287b9b;
    letter-spacing:.5px;
}

.email-content{padding:19px}

.email-field{margin-bottom:13px;overflow-wrap:anywhere}

.email-field small{
    display:block;
    color:#8ba0b0;
    font-size:10px;
    font-weight:900;
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.email-field strong{
    font-size:13px;
    color:#35556e;
    overflow-wrap:anywhere;
}

.email-body{
    border-top:1px solid #e7eff4;
    margin-top:15px;
    padding-top:15px;
    font-size:13px;
    line-height:1.85;
    color:#5d7488;
    white-space:pre-line;
    overflow-wrap:anywhere;
}

.email-link{
    margin-top:14px;
    padding:12px;
    border-radius:9px;
    background:#fff7e9;
    border:1px solid #f5e7c9;
    color:#a66b22;
    font-size:12px;
    overflow-wrap:anywhere;
}

.email-note{
    background:#eff9fc;
    border-left:4px solid var(--teal);
    padding:14px 16px;
    border-radius:9px;
    color:#547487;
    font-size:13px;
    line-height:1.7;
    margin:20px 0;
}

.options-title{
    font-size:15px;
    font-weight:850;
    color:#31536e;
    margin:25px 0 14px;
}

.option{
    display:flex;
    gap:13px;
    align-items:flex-start;
    border:1px solid #dceaf2;
    border-radius:12px;
    padding:16px;
    margin-bottom:11px;
    cursor:pointer;
    transition:.2s;
    background:#fff;
}

.option:hover{
    border-color:#66b8ce;
    background:#f2fbfd;
    transform:translateX(3px);
}

.option input{
    margin-top:4px;
    accent-color:var(--teal);
    width:16px;
    height:16px;
    flex-shrink:0;
}

.option span{
    font-size:14px;
    line-height:1.6;
    color:#48657c;
}

.option.locked{cursor:default;opacity:.95}

.button-row{
    display:flex;
    justify-content:flex-end;
    margin-top:25px;
    gap:12px;
}

.primary-btn,.secondary-btn{
    border:0;
    border-radius:10px;
    padding:13px 24px;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
    transition:.2s;
}

.primary-btn{
    background:linear-gradient(110deg,#318bd0,#18aa9d);
    color:#fff;
    box-shadow:0 5px 13px rgba(35,145,170,.2);
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(35,145,170,.25);
}

.primary-btn:disabled{
    background:#b9cbd4;
    box-shadow:none;
    cursor:not-allowed;
    transform:none;
}

.secondary-btn{
    background:#eaf5fa;
    color:#34758f;
    border:1px solid #d8eaf2;
}

.secondary-btn:hover{background:#dff1f5}

/* LIGHT 3D SIMULATION */

.scenario-card{
    display:none;
    margin-top:22px;
    overflow:hidden;
    animation:fadeUp .4s ease;
}

.scenario-top{
    background:linear-gradient(105deg,#eaf6ff,#e6f8f5);
    color:#285b78;
    padding:17px 21px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #dcebf3;
}

.scenario-top strong{
    font-size:12px;
    letter-spacing:.7px;
}

.scenario-timer{
    color:#159a91;
    font-weight:850;
    font-size:12px;
}

.scene-container{
    position:relative;
    width:100%;
    height:460px;
    background:linear-gradient(140deg,#e7f5fc,#d8edf5 55%,#e5f8f4);
    overflow:hidden;
}

#threeCanvas{display:block;width:100%;height:100%}

.scene-hud{
    position:absolute;
    top:16px;
    left:16px;
    z-index:3;
    width:min(320px,calc(100% - 32px));
    background:rgba(255,255,255,.92);
    border:1px solid rgba(90,170,190,.3);
    border-radius:12px;
    padding:14px 16px;
    color:#315b73;
    box-shadow:0 5px 20px rgba(50,110,140,.1);
    backdrop-filter:blur(10px);
    pointer-events:none;
}

.scene-hud small{
    display:block;
    color:#159a91;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.4px;
    margin-bottom:7px;
}

.scene-hud strong{
    display:block;
    font-size:15px;
    margin-bottom:6px;
    color:#2c5873;
}

.scene-hud p{
    font-size:12px;
    line-height:1.6;
    color:#71899a;
    margin:0;
}

.scene-status{
    position:absolute;
    right:16px;
    bottom:16px;
    z-index:3;
    background:rgba(255,255,255,.94);
    border:1px solid #cde8e6;
    border-radius:9px;
    padding:10px 14px;
    color:#168d83;
    font-size:11px;
    font-weight:900;
    box-shadow:0 4px 14px rgba(40,100,120,.08);
    pointer-events:none;
}

.scene-caption{
    padding:17px 20px;
    min-height:65px;
    background:#f2f9fc;
    color:#52748a;
    text-align:center;
    font-size:13px;
    line-height:1.7;
    border-top:1px solid #e1edf3;
}

.scene-progress{height:5px;background:#e2eff4}

.scene-progress-fill{
    width:0;
    height:100%;
    background:linear-gradient(90deg,#399bd6,#22b8a5);
    transition:width .4s;
}

.scenario-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    gap:12px;
    flex-wrap:wrap;
}

.scenario-controls small{color:#8ba0af;font-size:11px}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:700px){
    .email-grid{grid-template-columns:1fr}
    .question-card{padding:21px 16px}
    .question-title{font-size:21px}
    .scene-container{height:370px}
    .scene-status{right:10px;bottom:10px}
    .button-row{flex-direction:column}
    .button-row button{width:100%}
    header{padding:12px 4%}
    .header-label{font-size:10px}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<header>
    <img src="/static/img/fuji-logo.png"
         alt="Fuji Silvertech"
         class="logo"
         onerror="this.style.display='none'">
    <div class="header-label">PHISHING AWARENESS ASSESSMENT</div>
</header>

<main class="container">

    <section class="progress-card">
        <div class="progress-top">
            <span id="questionCounter">Question 1 of 10</span>
            <span id="progressPercent">10%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <section class="question-card" id="questionCard">
        <div class="category" id="questionCategory"></div>
        <h1 class="question-title" id="questionTitle"></h1>
        <div class="question-description" id="questionDescription"></div>
        <div id="emailArea"></div>
        <div class="email-note" id="emailNote"></div>
        <div class="options-title">Select the best response:</div>
        <div id="optionsArea"></div>
        <div class="button-row">
            <button class="primary-btn" id="continueButton" disabled>Continue</button>
        </div>
    </section>

    <section class="scenario-card" id="scenarioCard">
        <div class="scenario-top">
            <strong>3D CYBERSECURITY INCIDENT SIMULATION</strong>
            <span class="scenario-timer" id="scenarioTimer">Opening scene</span>
        </div>

        <div class="scene-container" id="sceneContainer">
            <canvas id="threeCanvas"></canvas>

            <div class="scene-hud">
                <small id="sceneKicker">INCIDENT PREVIEW</small>
                <strong id="sceneTitle">Incoming Email</strong>
                <p id="sceneDescription"></p>
            </div>

            <div class="scene-status" id="sceneStatus3D">SYSTEM ACTIVE</div>
        </div>

        <div class="scene-caption" id="sceneCaption"></div>
        <div class="scene-progress">
            <div class="scene-progress-fill" id="sceneProgressFill"></div>
        </div>

        <div class="scenario-controls">
            <button class="secondary-btn" id="replayButton">↻ Replay</button>
            <small id="scenarioStatus">3D simulation playing...</small>
            <button class="secondary-btn" id="skipButton">Skip</button>
        </div>
    </section>

</main>

<script>
const QUESTIONS = {{ questions | tojson }};
const ATTEMPT_ID = {{ attempt_id | tojson }};

let currentIndex=0;
let selectedAnswers={};

let renderer=null,scene=null,camera=null,clock=null;
let animationFrame=null;
let character=null,monitorScreen=null,emailPanel=null;
let alertObject=null,shieldObject=null;
let particles=[],dynamicObjects=[];
let introTimer=null;
let currentPhase="intro";
let introElapsed=0;
let introRunning=false;
let answerLocked=false,threeReady=false;

const questionCard=document.getElementById("questionCard");
const scenarioCard=document.getElementById("scenarioCard");
const continueButton=document.getElementById("continueButton");

/* HELPERS */

function escapeHTML(value){
    return String(value??"").replace(/[&<>"']/g,c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[c]);
}

function updateProgress(){
    const total=QUESTIONS.length;
    const number=currentIndex+1;

    document.getElementById("questionCounter").textContent=
        `Question ${number} of ${total}`;

    document.getElementById("progressPercent").textContent=
        `${Math.round(number/total*100)}%`;

    document.getElementById("progressFill").style.width=
        `${number/total*100}%`;
}

/* EMAIL RENDERING */

function renderEmail(email){
    return `
    <article class="email-card">
        <div class="email-heading">${escapeHTML(email.label||"EMAIL")}</div>
        <div class="email-content">

            <div class="email-field">
                <small>From</small>
                <strong>${escapeHTML(email.sender)}</strong>
            </div>

            <div class="email-field">
                <small>Email address</small>
                <strong>${escapeHTML(email.sender_email)}</strong>
            </div>

            ${email.to?`
            <div class="email-field">
                <small>To</small>
                <strong>${escapeHTML(email.to)}</strong>
            </div>`:""}

            ${email.reply_to?`
            <div class="email-field">
                <small>Reply-To</small>
                <strong>${escapeHTML(email.reply_to)}</strong>
            </div>`:""}

            <div class="email-field">
                <small>Received</small>
                <strong>${escapeHTML(email.timestamp)}</strong>
            </div>

            <div class="email-field">
                <small>Subject</small>
                <strong>${escapeHTML(email.subject)}</strong>
            </div>

            <div class="email-body">${escapeHTML(email.body)}</div>

            ${email.link?`
            <div class="email-link">
                <strong>Link:</strong><br>
                ${escapeHTML(email.link)}
            </div>`:""}

            ${email.attachment?`
            <div class="email-link">
                <strong>Attachment:</strong><br>
                ${escapeHTML(email.attachment)}
            </div>`:""}

        </div>
    </article>`;
}

/* 3D OBJECT HELPERS */

function addBox(w,h,d,color,x,y,z,options={}){
    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color,
            roughness:.75,
            metalness:.03,
            ...options
        })
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);
    return mesh;
}

function addSphere(radius,color,x,y,z){
    const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(radius,24,16),
        new THREE.MeshStandardMaterial({color,roughness:.55})
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);
    return mesh;
}

function addCylinder(top,bottom,height,color,x,y,z){
    const mesh=new THREE.Mesh(
        new THREE.CylinderGeometry(top,bottom,height,20),
        new THREE.MeshStandardMaterial({color})
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);
    return mesh;
}

function addFloatingLabel(text,color,x,y,z){
    const canvas=document.createElement("canvas");
    canvas.width=512;
    canvas.height=128;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="rgba(255,255,255,.96)";
    ctx.fillRect(0,0,512,128);

    ctx.strokeStyle=color;
    ctx.lineWidth=5;
    ctx.strokeRect(4,4,504,120);

    ctx.fillStyle=color;
    ctx.font="bold 30px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(String(text).slice(0,27),256,64);

    const texture=new THREE.CanvasTexture(canvas);

    const sprite=new THREE.Sprite(
        new THREE.SpriteMaterial({map:texture,transparent:true})
    );

    sprite.position.set(x,y,z);
    sprite.scale.set(3.2,.8,1);

    scene.add(sprite);
    dynamicObjects.push(sprite);

    return sprite;
}

function clearSceneLabels(){
    dynamicObjects.forEach(object=>{
        scene.remove(object);

        if(object.material?.map)object.material.map.dispose();

        object.material?.dispose();
    });

    dynamicObjects=[];
}

function createShield(){
    const group=new THREE.Group();

    const shape=new THREE.Shape();

    shape.moveTo(0,.55);
    shape.lineTo(.42,.35);
    shape.lineTo(.36,-.15);
    shape.lineTo(0,-.55);
    shape.lineTo(-.36,-.15);
    shape.lineTo(-.42,.35);
    shape.closePath();

    const geometry=new THREE.ExtrudeGeometry(shape,{
        depth:.12,
        bevelEnabled:true,
        bevelSegments:2,
        steps:1,
        bevelSize:.04,
        bevelThickness:.04
    });

    const shield=new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
            color:0x20b991,
            emissive:0x087b62,
            emissiveIntensity:.35,
            metalness:.15,
            roughness:.4
        })
    );

    shield.rotation.y=Math.PI;
    group.add(shield);

    const check=new THREE.Group();

    const first=new THREE.Mesh(
        new THREE.BoxGeometry(.1,.32,.08),
        new THREE.MeshStandardMaterial({color:0xffffff})
    );

    first.rotation.z=-.75;
    first.position.set(-.1,-.02,.2);

    const second=new THREE.Mesh(
        new THREE.BoxGeometry(.1,.48,.08),
        new THREE.MeshStandardMaterial({color:0xffffff})
    );

    second.rotation.z=.75;
    second.position.set(.13,.04,.2);

    check.add(first,second);
    group.add(check);

    group.position.set(2.5,3.6,-1);
    scene.add(group);
    group.visible=false;

    return group;
}

/* BUILD LIGHT OFFICE */

function buildOffice(){
    particles=[];

    scene.background=new THREE.Color(0xe5f3fa);
    scene.fog=new THREE.Fog(0xe5f3fa,14,30);

    addBox(20,.25,15,0xc7dce5,0,-.2,0);
    addBox(20,7,.25,0xd5eaf2,0,3.3,-7);
    addBox(.25,7,15,0xcce3ec,-10,3.3,0);
    addBox(.25,7,15,0xcce3ec,10,3.3,0);

    // Window
    addBox(5,2.8,.12,0x9bd5e7,-5,3.7,-6.8);
    addBox(.07,2.8,.08,0xffffff,-5,3.7,-6.7);
    addBox(5,.07,.08,0xffffff,-5,3.7,-6.7);

    // Desk
    addBox(5,.25,2,0xb98b68,0,1.55,-1);
    addBox(.22,1.5,.22,0x8da6b4,-2,.75,-1);
    addBox(.22,1.5,.22,0x8da6b4,2,.75,-1);
    addBox(.22,1.5,.22,0x8da6b4,-2,.75,.5);
    addBox(.22,1.5,.22,0x8da6b4,2,.75,.5);

    // Monitor
    addBox(3,2,.18,0x416e85,0,3,-1.5);

    monitorScreen=addBox(
        2.78,1.78,.025,0x67b6c9,0,3,-1.39,
        {emissive:0x267f93,emissiveIntensity:.25}
    );

    addBox(.18,.7,.18,0x91aab7,0,2,-1.4);
    addBox(1.5,.08,.45,0x728e9d,0,1.75,-.15);
    addSphere(.13,0xffffff,1.05,1.78,-.2);
    addCylinder(.15,.12,.35,0xffffff,-1.8,1.83,-.1);

    // Chair
    addBox(1.4,.2,1.1,0x6e9db1,0,.85,1.6);
    addBox(1.3,1.4,.18,0x6e9db1,0,1.6,2.1);

    // Employee
    character=new THREE.Group();

    const shirt=new THREE.Mesh(
        new THREE.BoxGeometry(1.15,1.35,.65),
        new THREE.MeshStandardMaterial({color:0x299f9b})
    );

    shirt.position.set(0,2,0);
    character.add(shirt);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.42,24,24),
        new THREE.MeshStandardMaterial({color:0xd6a47f})
    );

    head.position.set(0,3.05,-.05);
    character.add(head);

    const hair=new THREE.Mesh(
        new THREE.SphereGeometry(.43,24,12,0,Math.PI*2,0,Math.PI/2),
        new THREE.MeshStandardMaterial({color:0x50443f})
    );

    hair.position.set(0,3.14,-.05);
    character.add(hair);

    const leftArm=new THREE.Mesh(
        new THREE.BoxGeometry(.27,.95,.3),
        new THREE.MeshStandardMaterial({color:0x299f9b})
    );

    leftArm.position.set(-.7,1.95,-.4);
    leftArm.rotation.z=-.35;
    character.add(leftArm);

    const rightArm=leftArm.clone();

    rightArm.position.x=.7;
    rightArm.rotation.z=.35;
    character.add(rightArm);

    character.position.set(0,0,1.15);
    scene.add(character);

    emailPanel=addBox(2.7,1.65,.06,0xffffff,0,3.3,-.8);
    emailPanel.visible=false;

    alertObject=addSphere(.32,0xe75d64,2.5,4,-1);
    alertObject.visible=false;

    shieldObject=createShield();

    const light1=new THREE.PointLight(0xffffff,30,20);
    light1.position.set(-4,6,1);
    scene.add(light1);

    const light2=new THREE.PointLight(0x7bd9d0,18,18);
    light2.position.set(5,5,-3);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff,2));

    for(let i=0;i<35;i++){
        const particle=addSphere(
            .025,
            i%2?0x6dbbdc:0x73cbbd,
            (Math.random()-.5)*15,
            Math.random()*6,
            (Math.random()-.5)*10
        );

        particles.push(particle);
    }
}

/* INITIALIZE THREE.JS */

function initialize3D(){
    if(!window.THREE){
        document.getElementById("sceneStatus3D").textContent=
            "3D library unavailable";
        return false;
    }

    const canvas=document.getElementById("threeCanvas");
    const container=document.getElementById("sceneContainer");

    scene=new THREE.Scene();

    camera=new THREE.PerspectiveCamera(
        48,
        container.clientWidth/container.clientHeight,
        .1,
        100
    );

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);

    try{
        renderer=new THREE.WebGLRenderer({
            canvas,
            antialias:true,
            alpha:false
        });
    }catch(error){
        document.getElementById("sceneStatus3D").textContent=
            "WebGL unavailable";
        return false;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(container.clientWidth,container.clientHeight);

    renderer.shadowMap.enabled=true;

    clock=new THREE.Clock();

    buildOffice();

    window.addEventListener("resize",resize3D);

    threeReady=true;
    animate3D();

    return true;
}

function resize3D(){
    if(!renderer||!camera)return;

    const container=document.getElementById("sceneContainer");

    camera.aspect=container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );
}

function animate3D(){
    animationFrame=requestAnimationFrame(animate3D);

    const time=clock?clock.getElapsedTime():0;

    if(character){
        character.position.y=Math.sin(time*1.5)*.025;
    }

    particles.forEach((particle,i)=>{
        particle.position.y+=Math.sin(time+i)*.001;
        particle.rotation.y+=.005;
    });

    if(emailPanel?.visible){
        emailPanel.position.y=3.3+Math.sin(time*2)*.06;
    }

    if(alertObject?.visible){
        const pulse=1+Math.sin(time*5)*.13;

        alertObject.scale.setScalar(pulse);
        alertObject.rotation.y+=.025;
    }

    if(shieldObject?.visible){
        shieldObject.rotation.y=Math.sin(time)*.18;
        shieldObject.position.y=3.6+Math.sin(time*2)*.08;
    }

    if(renderer&&scene&&camera){
        renderer.render(scene,camera);
    }
}

function reset3DScene(){
    if(!threeReady)return;

    clearSceneLabels();

    emailPanel.visible=true;
    alertObject.visible=false;
    shieldObject.visible=false;

    monitorScreen.material.color.set(0x67b6c9);
    monitorScreen.material.emissive.set(0x267f93);

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);
}

function setSceneText(kicker,title,description,caption){
    document.getElementById("sceneKicker").textContent=kicker;
    document.getElementById("sceneTitle").textContent=title;
    document.getElementById("sceneDescription").textContent=description;
    document.getElementById("sceneCaption").textContent=caption;
}

/* INTRO ANIMATION */

function showIntroScene(){
    clearInterval(introTimer);

    currentPhase="intro";
    introRunning=true;
    introElapsed=0;

    const q=QUESTIONS[currentIndex];

    questionCard.style.display="none";
    scenarioCard.style.display="block";

    if(!threeReady&&!initialize3D()){
        document.getElementById("sceneDescription").textContent=
            "The 3D scene could not be loaded. Check your browser's WebGL support and internet connection.";
        return;
    }

    reset3DScene();

    setSceneText(
        "INCIDENT PREVIEW / QUESTION "+(currentIndex+1),
        q.title||"Incoming Security Message",
        q.scenario||"An employee receives a message that requires careful inspection.",
        "Watch the incident carefully. The question will appear after this opening scene."
    );

    document.getElementById("sceneStatus3D").textContent="NEW INCIDENT";
    document.getElementById("scenarioTimer").textContent="Opening scene";
    document.getElementById("scenarioStatus").textContent="3D simulation playing...";
    document.getElementById("sceneProgressFill").style.width="0%";

    introTimer=setInterval(()=>{
        introElapsed++;

        document.getElementById("sceneProgressFill").style.width=
            `${introElapsed/8*100}%`;

        if(introElapsed===2){
            clearSceneLabels();

            addFloatingLabel(
                "NEW EMAIL RECEIVED",
                "#168baf",
                0,4.35,-.65
            );

            document.getElementById("sceneStatus3D").textContent=
                "NEW EMAIL";
        }

        if(introElapsed===5){
            clearSceneLabels();

            addFloatingLabel(
                "EMPLOYEE INSPECTING",
                "#168baf",
                0,4.35,-.65
            );

            document.getElementById("sceneStatus3D").textContent=
                "UNDER REVIEW";

            camera.position.set(4,4.2,7);
            camera.lookAt(0,2.8,-.5);
        }

        if(introElapsed>=8){
            clearInterval(introTimer);

            introRunning=false;

            scenarioCard.style.display="none";
            questionCard.style.display="block";

            document.getElementById("scenarioStatus").textContent=
                "Opening scene completed.";
        }

    },1000);
}

/* REPLAY AND SKIP */

function replayScene(){
    if(currentPhase==="intro"){
        showIntroScene();
    }
}

function skipScene(){
    if(currentPhase==="intro"&&introRunning){
        clearInterval(introTimer);

        introRunning=false;

        scenarioCard.style.display="none";
        questionCard.style.display="block";

        document.getElementById("scenarioStatus").textContent=
            "Opening scene skipped.";
    }
}

/* RENDER QUESTION */

function renderQuestion(){
    clearInterval(introTimer);

    answerLocked=false;

    const q=QUESTIONS[currentIndex];

    selectedAnswers[currentIndex]=undefined;

    questionCard.style.display="none";
    scenarioCard.style.display="none";

    updateProgress();

    document.getElementById("questionCategory").textContent=
        q.category||"PHISHING INVESTIGATION";

    document.getElementById("questionTitle").textContent=
        q.title||`Question ${currentIndex+1}`;

    document.getElementById("questionDescription").textContent=
        q.scenario||"";

    const emailNote=document.getElementById("emailNote");

    emailNote.textContent=q.email_note||"";
    emailNote.style.display=q.email_note?"block":"none";

    const emailArea=document.getElementById("emailArea");

    if(q.comparison&&Array.isArray(q.emails)){
        emailArea.innerHTML=`
            <div class="email-grid">
                ${q.emails.map(renderEmail).join("")}
            </div>`;
    }else{
        const email={
            label:"EMAIL DETAILS",
            sender:q.sender,
            sender_email:q.sender_email,
            timestamp:q.timestamp,
            subject:q.subject,
            body:q.scenario,
            link:q.display_link,
            attachment:q.attachment
        };

        if(q.sender||q.sender_email||q.subject||q.display_link||q.attachment){
            emailArea.innerHTML=`
                <div class="email-grid">
                    ${renderEmail(email)}
                </div>`;
        }else{
            emailArea.innerHTML="";
        }
    }

    const optionsArea=document.getElementById("optionsArea");

    optionsArea.innerHTML="";

    (q.options||[]).forEach((option,index)=>{
        const label=document.createElement("label");

        label.className="option";

        const input=document.createElement("input");

        input.type="radio";
        input.name="answer";
        input.value=index;

        const span=document.createElement("span");

        span.textContent=option;

        input.addEventListener("change",()=>{
            if(answerLocked)return;

            answerLocked=true;

            selectedAnswers[currentIndex]=index;

            document.querySelectorAll('input[name="answer"]').forEach(radio=>{
                radio.disabled=true;
            });

            document.querySelectorAll(".option").forEach(item=>{
                item.classList.add("locked");
            });

            continueButton.disabled=false;

            continueButton.textContent=
                currentIndex===QUESTIONS.length-1
                ?"Submit Assessment"
                :"Continue";
        });

        label.append(input,span);

        optionsArea.appendChild(label);
    });

    continueButton.disabled=true;

    continueButton.textContent=
        currentIndex===QUESTIONS.length-1
        ?"Submit Assessment"
        :"Continue";

    showIntroScene();
}

/* CONTINUE */

function proceed(){
    if(selectedAnswers[currentIndex]===undefined)return;

    if(currentIndex===QUESTIONS.length-1){
        submitAssessment();
        return;
    }

    currentIndex++;

    renderQuestion();
}

/* SUBMIT TO FLASK */

async function submitAssessment(){
    clearInterval(introTimer);

    continueButton.disabled=true;
    continueButton.textContent="Submitting...";

    const answers=QUESTIONS.map((question,index)=>{
        return selectedAnswers[index]!==undefined
            ?selectedAnswers[index]
            :null;
    });

    try{
        const response=await fetch("/submit",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                attempt_id:ATTEMPT_ID,
                answers:answers
            })
        });

        const result=await response.json();

        if(!response.ok){
            throw new Error(result.error||"Submission failed.");
        }

        if(result.url){
            window.location.href=result.url;
        }else{
            throw new Error("Results URL was not returned.");
        }

    }catch(error){
        alert(error.message||"Unable to submit assessment.");

        continueButton.disabled=false;
        continueButton.textContent="Retry Submission";
    }
}

/* BUTTON EVENTS */

continueButton.addEventListener("click",proceed);

document.getElementById("replayButton").addEventListener(
    "click",
    replayScene
);

document.getElementById("skipButton").addEventListener(
    "click",
    skipScene
);

/* START */

if(Array.isArray(QUESTIONS)&&QUESTIONS.length===10){
    renderQuestion();
}else{
    questionCard.style.display="block";

    questionCard.innerHTML=`
        <h2>Unable to load the assessment.</h2>
        <p>Please contact the administrator.</p>
    `;
}
</script>
