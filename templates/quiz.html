
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness Assessment | Fuji Silvertech</title>
<link rel="stylesheet" href="/static/style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eaf5ff, #f8fbff 55%, #e5f1fb);
    color: #17334e;
}

header {
    background: white;
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(20, 60, 100, .07);
}

.logo {
    max-height: 52px;
    max-width: 190px;
    object-fit: contain;
}

.header-label {
    color: #42627e;
    font-size: 13px;
    font-weight: 600;
}

.container {
    max-width: 1000px;
    margin: 35px auto;
    padding: 0 18px 50px;
}

.progress-card,
.question-card,
.email-card,
.scenario-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 5px 24px rgba(30, 70, 110, .08);
}

.progress-card {
    padding: 18px 22px;
    margin-bottom: 20px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 700;
}

.progress-track {
    height: 9px;
    background: #e7eff7;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1976d2, #36a3ef);
    transition: width .4s ease;
}

.question-card {
    padding: 28px;
}

.category {
    display: inline-block;
    background: #e9f3ff;
    color: #1765a5;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .5px;
    margin-bottom: 14px;
}

.question-title {
    font-size: 23px;
    margin: 0 0 12px;
    line-height: 1.4;
}

.question-description {
    color: #60768b;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    margin-bottom: 22px;
}

.email-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin: 20px 0;
}

.email-card {
    border: 1px solid #dce7f1;
    overflow: hidden;
    min-width: 0;
}

.email-heading {
    padding: 13px 17px;
    background: #edf5fc;
    border-bottom: 1px solid #dce7f1;
    font-size: 13px;
    font-weight: 800;
    color: #24577e;
}

.email-content {
    padding: 18px;
}

.email-field {
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.email-field small {
    display: block;
    color: #8496a8;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.email-field strong {
    font-size: 13px;
    color: #29465f;
    overflow-wrap: anywhere;
}

.email-body {
    border-top: 1px solid #e6edf4;
    margin-top: 15px;
    padding-top: 15px;
    font-size: 13px;
    line-height: 1.8;
    color: #526a80;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

.email-link {
    margin-top: 14px;
    padding: 11px;
    border-radius: 8px;
    background: #fff4e8;
    color: #ad5a16;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.email-note {
    background: #f0f7ff;
    border-left: 4px solid #348bd1;
    padding: 13px 15px;
    border-radius: 7px;
    color: #496781;
    font-size: 13px;
    line-height: 1.6;
    margin: 20px 0;
}

.options-title {
    font-size: 15px;
    font-weight: 800;
    margin: 24px 0 13px;
}

.option {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border: 1px solid #dce7f1;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 11px;
    cursor: pointer;
    transition: .2s;
    background: white;
}

.option:hover {
    border-color: #4b9cda;
    background: #f5faff;
}

.option input {
    margin-top: 4px;
    accent-color: #1976d2;
}

.option span {
    font-size: 14px;
    line-height: 1.55;
}

.option.correct {
    border-color: #2caa70;
    background: #edfff5;
}

.option.wrong {
    border-color: #e36b6b;
    background: #fff2f2;
}

.answer-feedback {
    display: none;
    margin-top: 17px;
    padding: 15px;
    border-radius: 9px;
    line-height: 1.65;
    font-size: 13px;
}

.answer-feedback.correct {
    display: block;
    background: #eafff2;
    border: 1px solid #a8e7c1;
    color: #176a42;
}

.answer-feedback.wrong {
    display: block;
    background: #fff0f0;
    border: 1px solid #f2b8b8;
    color: #9a3030;
}

.button-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 25px;
    gap: 12px;
}

.primary-btn,
.secondary-btn {
    border: 0;
    border-radius: 9px;
    padding: 13px 23px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.primary-btn {
    background: #176db2;
    color: white;
}

.primary-btn:hover {
    background: #10578f;
    transform: translateY(-1px);
}

.primary-btn:disabled {
    background: #9db2c4;
    cursor: not-allowed;
    transform: none;
}

.secondary-btn {
    background: #eaf2f9;
    color: #315b7d;
}

/* Animation panel */

.scenario-card {
    display: none;
    margin-top: 22px;
    overflow: hidden;
    border: 1px solid #d6e4f0;
}

.scenario-top {
    background: #102d49;
    color: white;
    padding: 17px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.scenario-top strong {
    font-size: 14px;
}

.scenario-timer {
    font-size: 13px;
    font-weight: 800;
    color: #8ed5ff;
}

.scene {
    position: relative;
    min-height: 300px;
    overflow: hidden;
    padding: 32px 25px;
    background: linear-gradient(135deg, #122c49, #174c70 65%, #16799b);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.scene::before,
.scene::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(110, 205, 255, .10);
    animation: floatBubble 7s infinite ease-in-out alternate;
}

.scene::before {
    width: 220px;
    height: 220px;
    left: -65px;
    top: -80px;
}

.scene::after {
    width: 280px;
    height: 280px;
    right: -95px;
    bottom: -120px;
    animation-delay: 1.5s;
}

@keyframes floatBubble {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-25px) scale(1.1); }
}

.scene-icon {
    position: relative;
    z-index: 1;
    width: 83px;
    height: 83px;
    border-radius: 22px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 39px;
    margin-bottom: 18px;
    animation: iconPulse 2s infinite ease-in-out;
}

@keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.scene-kicker {
    position: relative;
    z-index: 1;
    color: #8ed5ff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.scene h2 {
    position: relative;
    z-index: 1;
    font-size: 23px;
    margin: 0 0 12px;
}

.scene p {
    position: relative;
    z-index: 1;
    max-width: 600px;
    color: #d4e7f5;
    font-size: 14px;
    line-height: 1.7;
    margin: 0;
}

.scene-notification {
    position: relative;
    z-index: 1;
    margin-top: 20px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;
    padding: 13px 18px;
    max-width: 560px;
    width: 100%;
    font-size: 13px;
    color: white;
    animation: notificationIn .5s ease;
}

@keyframes notificationIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.scene-caption {
    padding: 15px 20px;
    min-height: 58px;
    background: #f0f6fb;
    color: #3d607d;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
}

.scene-progress {
    height: 5px;
    background: #dbe7f0;
}

.scene-progress-fill {
    width: 0%;
    height: 100%;
    background: #32a4e8;
    transition: width .3s linear;
}

.scenario-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    gap: 12px;
    flex-wrap: wrap;
}

.scenario-controls small {
    color: #8294a4;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width: 700px) {
    .email-grid {
        grid-template-columns: 1fr;
    }

    .question-card {
        padding: 20px 16px;
    }

    .question-title {
        font-size: 20px;
    }

    .scene {
        min-height: 280px;
        padding: 25px 18px;
    }

    .scene h2 {
        font-size: 20px;
    }

    .button-row {
        flex-direction: column;
    }

    .button-row button {
        width: 100%;
    }

    header {
        padding: 12px 4%;
    }
}
</style>
</head>

<body>

<header>
    <img src="/static/img/fuji-logo.png"
         alt="Fuji Silvertech"
         class="logo"
         onerror="this.style.display='none'">

    <div class="header-label">PHISHING AWARENESS ASSESSMENT</div>
</header>

<main class="container">

    <section class="progress-card">
        <div class="progress-top">
            <span id="questionCounter">Question 1 of 10</span>
            <span id="progressPercent">10%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <section class="question-card" id="questionCard">

        <div class="category" id="questionCategory"></div>

        <h1 class="question-title" id="questionTitle"></h1>

        <div class="question-description" id="questionDescription"></div>

        <div id="emailArea"></div>

        <div class="email-note" id="emailNote"></div>

        <div class="options-title">Select the best response:</div>

        <div id="optionsArea"></div>

        <div class="answer-feedback" id="answerFeedback"></div>

        <div class="button-row">
            <button class="primary-btn" id="continueButton" disabled>
                Continue
            </button>
        </div>

    </section>

    <!-- Animation plays after the employee answers -->

    <section class="scenario-card" id="scenarioCard">

        <div class="scenario-top">
            <strong>SECURITY INCIDENT SIMULATION</strong>
            <span class="scenario-timer" id="scenarioTimer">25 seconds</span>
        </div>

        <div class="scene">

            <div class="scene-icon" id="sceneIcon">📧</div>

            <div class="scene-kicker" id="sceneKicker">
                SECURITY AWARENESS
            </div>

            <h2 id="sceneTitle">Incoming Email Detected</h2>

            <p id="sceneDescription"></p>

            <div class="scene-notification" id="sceneNotification"></div>

        </div>

        <div class="scene-caption" id="sceneCaption"></div>

        <div class="scene-progress">
            <div class="scene-progress-fill" id="sceneProgressFill"></div>
        </div>

        <div class="scenario-controls">

            <button class="secondary-btn" id="replayButton">
                ↻ Replay
            </button>

            <small id="scenarioStatus">Playing security scenario...</small>

            <button class="secondary-btn" id="skipButton">
                Skip
            </button>

        </div>

        <div class="button-row" style="padding: 0 20px 20px; margin-top: 0;">
            <button class="primary-btn" id="nextQuestionButton" disabled>
                Continue to Next Question
            </button>
        </div>

    </section>

</main>

<script>
const QUESTIONS = {{ questions | tojson }};
const ATTEMPT_ID = {{ attempt_id | tojson }};

let currentIndex = 0;
let selectedAnswers = {};
let scenarioInterval = null;
let scenarioSeconds = 25;
let scenarioPlaying = false;
let scenarioFinished = false;

const questionCard = document.getElementById("questionCard");
const scenarioCard = document.getElementById("scenarioCard");
const continueButton = document.getElementById("continueButton");
const nextQuestionButton = document.getElementById("nextQuestionButton");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

function updateProgress() {
    const total = QUESTIONS.length;
    const number = currentIndex + 1;
    const percentage = Math.round((number / total) * 100);

    document.getElementById("questionCounter").textContent =
        `Question ${number} of ${total}`;

    document.getElementById("progressPercent").textContent =
        `${percentage}%`;

    document.getElementById("progressFill").style.width =
        `${percentage}%`;
}

function renderEmail(email) {
    const link = email.link
        ? `<div class="email-link"><strong>Link:</strong><br>${escapeHTML(email.link)}</div>`
        : "";

    const attachment = email.attachment
        ? `<div class="email-link"><strong>Attachment:</strong><br>${escapeHTML(email.attachment)}</div>`
        : "";

    return `
        <article class="email-card">
            <div class="email-heading">
                ${escapeHTML(email.label || "EMAIL")}
            </div>

            <div class="email-content">

                <div class="email-field">
                    <small>From</small>
                    <strong>${escapeHTML(email.sender || "")}</strong>
                </div>

                <div class="email-field">
                    <small>Email address</small>
                    <strong>${escapeHTML(email.sender_email || "")}</strong>
                </div>

                <div class="email-field">
                    <small>Received</small>
                    <strong>${escapeHTML(email.timestamp || "")}</strong>
                </div>

                <div class="email-field">
                    <small>Subject</small>
                    <strong>${escapeHTML(email.subject || "")}</strong>
                </div>

                <div class="email-body">${escapeHTML(email.body || "")}</div>

                ${link}
                ${attachment}

            </div>
        </article>
    `;
}

function renderQuestion() {
    stopScenario();

    const q = QUESTIONS[currentIndex];

    questionCard.style.display = "block";
    scenarioCard.style.display = "none";

    updateProgress();

    document.getElementById("questionCategory").textContent =
        q.category || "PHISHING INVESTIGATION";

    document.getElementById("questionTitle").textContent =
        q.title || `Question ${currentIndex + 1}`;

    document.getElementById("questionDescription").textContent =
        q.scenario || "";

    document.getElementById("emailNote").textContent =
        q.email_note || "";

    const emailArea = document.getElementById("emailArea");

    if (q.comparison && Array.isArray(q.emails)) {
        emailArea.innerHTML = `
            <div class="email-grid">
                ${q.emails.map(renderEmail).join("")}
            </div>
        `;
    } else {
        const singleEmail = {
            label: "EMAIL DETAILS",
            sender: q.sender,
            sender_email: q.sender_email,
            timestamp: q.timestamp,
            subject: q.subject,
            body: q.body || "",
            link: q.display_link,
            attachment: q.attachment
        };

        emailArea.innerHTML = `
            <div class="email-grid">
                ${renderEmail(singleEmail)}
            </div>
        `;
    }

    const optionsArea = document.getElementById("optionsArea");
    optionsArea.innerHTML = "";

    (q.options || []).forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "answer";
        input.value = index;

        const span = document.createElement("span");
        span.textContent = option;

        input.addEventListener("change", () => {
            selectedAnswers[currentIndex] = index;

            continueButton.disabled = false;
            showAnswerFeedback(index);
        });

        label.appendChild(input);
        label.appendChild(span);
        optionsArea.appendChild(label);
    });

    const feedback = document.getElementById("answerFeedback");
    feedback.className = "answer-feedback";
    feedback.textContent = "";

    continueButton.disabled = true;
    continueButton.textContent = "Continue";
}

function showAnswerFeedback(selectedIndex) {
    const q = QUESTIONS[currentIndex];
    const feedback = document.getElementById("answerFeedback");
    const options = document.querySelectorAll(".option");

    options.forEach((option, index) => {
        option.classList.remove("correct", "wrong");

        if (index === Number(q.correct)) {
            option.classList.add("correct");
        }

        if (index === selectedIndex && index !== Number(q.correct)) {
            option.classList.add("wrong");
        }
    });

    const isCorrect = selectedIndex === Number(q.correct);

    feedback.className =
        "answer-feedback " + (isCorrect ? "correct" : "wrong");

    feedback.innerHTML = `
        <strong>${isCorrect ? "Correct response" : "Not quite right"}</strong>
        <br>
        ${escapeHTML(q.explanation || "Review the email carefully and follow the company security process.")}
    `;
}

function getScenarioStages(q, index) {
    const title = (q.title || "").toLowerCase();
    const category = (q.category || "").toLowerCase();

    let subject = "Suspicious Email";
    let icon = "📧";
    let threat = "An unexpected message has arrived.";
    let action = "Review the sender, message and destination before taking action.";

    if (title.includes("microsoft")) {
        subject = "Microsoft Account Alert";
        icon = "🛡️";
        threat = "A message claims that unusual sign-in activity has been detected.";
        action = "The employee must inspect the sender domain and verify the alert independently.";
    } else if (title.includes("password")) {
        subject = "Company Password Maintenance";
        icon = "🔐";
        threat = "Two password-maintenance emails arrive with different sender addresses.";
        action = "The employee compares the official company domain against the suspicious lookalike.";
    } else if (title.includes("document")) {
        subject = "Unexpected Shared Document";
        icon = "📄";
        threat = "A document-sharing notification pressures an employee to sign in.";
        action = "The employee verifies the sharing request using a trusted company channel.";
    } else if (title.includes("salary")) {
        subject = "HR Salary Revision";
        icon = "💼";
        threat = "Two salary-revision messages request different employee actions.";
        action = "The employee checks the HR domain and refuses requests for passwords or banking credentials.";
    } else if (title.includes("project")) {
        subject = "Project Coordination";
        icon = "📁";
        threat = "A project update arrives with an attachment.";
        action = "The employee checks the context and follows the normal attachment security process.";
    } else if (title.includes("security policy")) {
        subject = "Security Policy Update";
        icon = "🖥️";
        threat = "A policy message contains an external file-sharing link.";
        action = "The employee checks the destination and contacts the security team through an approved channel.";
    } else if (title.includes("benefits")) {
        subject = "Employee Benefits Enrollment";
        icon = "📋";
        threat = "A benefits form asks employees to submit personal information.";
        action = "The employee verifies the enrollment process directly with HR.";
    } else if (title.includes("google storage")) {
        subject = "Google Storage Warning";
        icon = "☁️";
        threat = "Two storage notifications warn about possible file deletion.";
        action = "The employee checks the sender domain and visits the official service directly.";
    } else if (title.includes("payment")) {
        subject = "Vendor Payment Confirmation";
        icon = "💳";
        threat = "An invoice-processing confirmation appears in the finance workflow.";
        action = "The employee checks the invoice using the approved finance process.";
    } else if (title.includes("executive")) {
        subject = "Executive Impersonation";
        icon = "⚠️";
        threat = "An urgent confidential payment request claims to come from a senior executive.";
        action = "The employee independently verifies the request before any financial action.";
    }

    return [
        {
            kicker: "INCOMING MESSAGE",
            title: "A New Message Arrives",
            description: `${subject}: ${threat}`,
            notification: "New email notification received.",
            caption: "An employee receives a message that requires careful inspection."
        },
        {
            kicker: "INITIAL INSPECTION",
            title: "Inspect the Email",
            description: "The sender, subject, message and links need to be examined before responding.",
            notification: "Checking sender identity and message details...",
            caption: "A familiar logo or display name does not prove that an email is genuine."
        },
        {
            kicker: "THREAT ANALYSIS",
            title: "Look for Warning Signs",
            description: "Look for unusual domains, urgency, spelling errors and requests for sensitive information.",
            notification: "Security indicators are being reviewed.",
            caption: "Small details in an email can reveal a phishing attempt."
        },
        {
            kicker: "EMPLOYEE RESPONSE",
            title: "Choose a Safe Action",
            description: action,
            notification: "The employee follows the approved verification process.",
            caption: "Pause, verify and report suspicious messages instead of interacting with them."
        },
        {
            kicker: "SECURITY AWARENESS",
            title: "Protect Company Information",
            description: "A careful employee helps protect company accounts, information and colleagues.",
            notification: "Security awareness scenario completed.",
            caption: "Think before you click. Verify before you trust. Report when in doubt."
        }
    ];
}

function playScenario() {
    const q = QUESTIONS[currentIndex];

    if (!q) return;

    questionCard.style.display = "none";
    scenarioCard.style.display = "block";

    scenarioSeconds = 25;
    scenarioPlaying = true;
    scenarioFinished = false;

    nextQuestionButton.disabled = true;
    document.getElementById("scenarioTimer").textContent = "25 seconds";
    document.getElementById("scenarioStatus").textContent =
        "Playing security scenario...";

    const stages = getScenarioStages(q, currentIndex);

    const stageDuration = 5;
    let elapsed = 0;

    function updateScene() {
        const stageIndex = Math.min(
            Math.floor(elapsed / stageDuration),
            stages.length - 1
        );

        const stage = stages[stageIndex];

        document.getElementById("sceneIcon").textContent =
            getScenarioIcon(q, stageIndex);

        document.getElementById("sceneKicker").textContent =
            stage.kicker;

        document.getElementById("sceneTitle").textContent =
            stage.title;

        document.getElementById("sceneDescription").textContent =
            stage.description;

        document.getElementById("sceneNotification").textContent =
            stage.notification;

        document.getElementById("sceneCaption").textContent =
            stage.caption;

        document.getElementById("sceneProgressFill").style.width =
            `${(elapsed / 25) * 100}%`;
    }

    updateScene();

    stopScenario();

    scenarioInterval = setInterval(() => {
        elapsed++;
        scenarioSeconds = 25 - elapsed;

        document.getElementById("scenarioTimer").textContent =
            scenarioSeconds > 0
                ? `${scenarioSeconds} seconds`
                : "Completed";

        updateScene();

        if (elapsed >= 25) {
            finishScenario();
        }
    }, 1000);
}

function getScenarioIcon(q, stageIndex) {
    const stages = getScenarioStages(q, currentIndex);

    const title = (q.title || "").toLowerCase();

    let icon = "📧";

    if (title.includes("microsoft")) icon = "🛡️";
    else if (title.includes("password")) icon = "🔐";
    else if (title.includes("document")) icon = "📄";
    else if (title.includes("salary")) icon = "💼";
    else if (title.includes("project")) icon = "📁";
    else if (title.includes("security policy")) icon = "🖥️";
    else if (title.includes("benefits")) icon = "📋";
    else if (title.includes("google storage")) icon = "☁️";
    else if (title.includes("payment")) icon = "💳";
    else if (title.includes("executive")) icon = "⚠️";

    return stageIndex === 2 ? "🔍" :
           stageIndex === 3 ? "🛡️" :
           stageIndex === 4 ? "✅" : icon;
}

function finishScenario() {
    stopScenario();

    scenarioPlaying = false;
    scenarioFinished = true;

    document.getElementById("scenarioTimer").textContent = "Completed";
    document.getElementById("scenarioStatus").textContent =
        "Scenario completed. You can continue.";

    document.getElementById("sceneProgressFill").style.width = "100%";

    nextQuestionButton.disabled = false;
}

function stopScenario() {
    if (scenarioInterval) {
        clearInterval(scenarioInterval);
        scenarioInterval = null;
    }
}

function replayScenario() {
    if (scenarioPlaying) return;
    playScenario();
}

function skipScenario() {
    if (!scenarioPlaying && !scenarioFinished) return;
    finishScenario();
}

function proceed() {
    if (selectedAnswers[currentIndex] === undefined) {
        return;
    }

    // The final question submits without an extra animation.
    if (currentIndex === QUESTIONS.length - 1) {
        submitAssessment();
        return;
    }

    playScenario();
}

function nextQuestion() {
    if (!scenarioFinished) return;

    stopScenario();

    currentIndex++;

    if (currentIndex >= QUESTIONS.length) {
        submitAssessment();
        return;
    }

    renderQuestion();
}

async function submitAssessment() {
    stopScenario();

    continueButton.disabled = true;
    nextQuestionButton.disabled = true;

    document.getElementById("scenarioStatus").textContent =
        "Submitting your assessment...";

    const payload = {
        attempt_id: ATTEMPT_ID,
        answers: selectedAnswers
    };

    try {
        const response = await fetch("/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Submission failed.");
        }

        if (result.url) {
            window.location.href = result.url;
        } else {
            throw new Error("The server did not return a results page.");
        }

    } catch (error) {
        alert(error.message || "Unable to submit. Please try again.");
        continueButton.disabled = false;
        nextQuestionButton.disabled = false;
    }
}

continueButton.addEventListener("click", proceed);
nextQuestionButton.addEventListener("click", nextQuestion);

document.getElementById("replayButton")
    .addEventListener("click", replayScenario);

document.getElementById("skipButton")
    .addEventListener("click", skipScenario);

if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {
    document.getElementById("questionCard").innerHTML =
        "<h2>No questions are available. Please contact the administrator.</h2>";
} else {
    renderQuestion();
}
</script>
