<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishing Awareness | Fuji Silvertech</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        .email-card {
            background: #fff;
            color: #202124;
            border: 1px solid #dadce0;
            border-radius: 12px;
            margin: 22px 0;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
            font-family: Arial, sans-serif;
        }

        .email-top {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            color: #5f6368;
            font-size: 13px;
        }

        .email-subject {
            font-size: 21px;
            margin: 14px 0 22px;
            color: #202124;
            overflow-wrap: anywhere;
        }

        .sender-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .sender-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #dbe7ff;
            color: #2455a4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .sender-details {
            min-width: 0;
            font-size: 14px;
        }

        .sender-details p {
            margin: 3px 0;
            overflow-wrap: anywhere;
        }

        .sender-address,
        .email-time {
            color: #5f6368;
        }

        .email-body {
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-line;
            overflow-wrap: anywhere;
            margin-top: 18px;
        }

        .email-link {
            display: inline-block;
            margin: 12px 0;
            padding: 10px 17px;
            border-radius: 5px;
            background: #168bd2;
            color: white;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .email-attachment {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: #f8f9fa;
            font-size: 13px;
        }

        .email-warning {
            margin-top: 16px;
            padding: 12px;
            border-left: 4px solid #e2a03f;
            background: #fff8e8;
            color: #654b1d;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .evidence-label {
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: bold;
            color: #6b7280;
        }

        .document-preview {
            margin-top: 16px;
            padding: 18px;
            background: #f7f9fc;
            border: 1px solid #d9e2ec;
            border-radius: 10px;
            color: #24364b;
            font-family: Arial, sans-serif;
        }

        .document-sheet {
            max-width: 620px;
            margin: 10px auto 0;
            padding: 22px;
            background: white;
            border: 1px solid #d6dde6;
            box-shadow: 0 4px 14px rgba(31,55,80,.08);
        }

        .document-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 2px solid #dce5ee;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .document-head strong {
            font-size: 17px;
        }

        .document-stamp {
            border: 2px solid #b45309;
            color: #9a3412;
            padding: 5px 8px;
            font-size: 10px;
            font-weight: 800;
            transform: rotate(-3deg);
            white-space: nowrap;
        }

        .document-lines {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px 16px;
            font-size: 12px;
            margin: 14px 0;
        }

        .document-lines div {
            padding: 8px;
            background: #f5f7fa;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }

        .document-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .document-table th,
        .document-table td {
            border: 1px solid #dce3eb;
            padding: 8px;
            font-size: 11px;
        }

        .document-alert {
            margin-top: 13px;
            padding: 10px;
            background: #fff4e5;
            border-left: 4px solid #d97706;
            font-size: 12px;
            line-height: 1.5;
        }

        .simulation-note {
            margin-top: 10px;
            color: #64748b;
            font-size: 11px;
            text-align: center;
        }

        .question-heading {
            margin-top: 28px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
        }

        .nav button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .options label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }

        .options label span {
            line-height: 1.55;
        }

        .options input {
            flex-shrink: 0;
            margin-top: 5px;
        }

        .submit-error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 12px;
        }

        .answer-feedback {
            margin-top: 18px;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            line-height: 1.6;
        }

        .answer-feedback.correct {
            background: #e8f7ed;
            color: #176b37;
            border: 1px solid #8bd3a2;
        }

        .answer-feedback.incorrect {
            background: #fff0f0;
            color: #a32626;
            border: 1px solid #e6a0a0;
        }

        /* Find the mistakes */

        .mistake-instructions {
            background: #eaf3ff;
            color: #174477;
            padding: 15px;
            border-radius: 9px;
            margin: 15px 0;
            line-height: 1.6;
        }

        .mistake-list {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .mistake-item {
            background: #fff;
            color: #26364a;
            border: 2px solid #d5dfeb;
            border-radius: 9px;
            padding: 14px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-size: 14px;
            line-height: 1.5;
            transition: .2s;
        }

        .mistake-item:hover {
            border-color: #168bd2;
            background: #f1f8ff;
        }

        .mistake-item.selected {
            border-color: #dc3545;
            background: #fff0f0;
            color: #a32626;
        }

        .mistake-item.selected::before {
            content: "✓ ";
            font-weight: bold;
        }

        .mistake-item:focus-visible {
            outline: 3px solid #168bd2;
            outline-offset: 2px;
        }

        .mistake-count {
            margin-top: 13px;
            font-weight: bold;
            color: #174477;
        }

        @media(max-width:600px) {
            .email-card {
                padding: 15px;
            }

            .email-subject {
                font-size: 18px;
            }

            .nav button {
                font-size: 13px;
            }

            .document-lines {
                grid-template-columns: 1fr;
            }

            .document-sheet {
                padding: 13px;
            }
        }

        /* 25-second animated training scene */

        .video-simulation {
            margin: 18px 0 24px;
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #102b49, #164c73 60%, #087e9b);
            color: #fff;
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(10,42,70,.2);
        }

        .video-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            letter-spacing: .7px;
            text-transform: uppercase;
            color: #d7efff;
        }

        .video-duration {
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 30px;
            padding: 5px 10px;
            font-weight: 700;
        }

        .animation-stage {
            position: relative;
            min-height: 190px;
            margin: 15px 0 12px;
            padding: 18px;
            border-radius: 12px;
            background: radial-gradient(circle at 80% 15%,rgba(82,211,255,.25),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
            border: 1px solid rgba(255,255,255,.2);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .animation-person {
            width: 92px;
            height: 120px;
            flex: 0 0 92px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .person-head {
            position: absolute;
            top: 5px;
            width: 43px;
            height: 43px;
            border-radius: 50%;
            background: #ffd2a6;
            border: 3px solid rgba(255,255,255,.7);
            animation: personLook 3s ease-in-out infinite;
        }

        .person-body {
            width: 72px;
            height: 67px;
            border-radius: 30px 30px 10px 10px;
            background: #48b7d9;
            box-shadow: inset 0 -8px rgba(0,0,0,.1);
        }

        .animation-person.alert .person-body {
            background: #e6a34c;
        }

        .animation-person.safe .person-body {
            background: #43bd87;
        }

        .animation-content {
            flex: 1;
            min-width: 0;
        }

        .animation-content small {
            display: block;
            color: #bfeaff;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .animation-content h3 {
            margin: 0 0 8px;
            font-size: clamp(17px,3vw,23px);
            color: #fff;
        }

        .animation-content p {
            margin: 0;
            color: #e5f5ff;
            line-height: 1.5;
            font-size: 14px;
        }

        .scene-notification {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 12px;
            padding: 9px 12px;
            border-radius: 9px;
            background: rgba(255,255,255,.95);
            color: #17334e;
            font-size: 12px;
            font-weight: 700;
            animation: notificationPop .45s ease both;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .scene-notification span:first-child {
            font-size: 18px;
        }

        .scene-progress {
            height: 6px;
            border-radius: 20px;
            background: rgba(255,255,255,.2);
            overflow: hidden;
        }

        .scene-progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #75e2c0;
            transition: width .2s linear;
        }

        .scene-caption {
            margin: 9px 0 0;
            color: #d7efff;
            font-size: 12px;
            min-height: 18px;
        }

        .scene-controls {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .scene-controls button {
            border: 1px solid rgba(255,255,255,.45);
            background: rgba(255,255,255,.12);
            color: #fff;
            border-radius: 8px;
            padding: 8px 13px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }

        .scene-controls button:hover {
            background: rgba(255,255,255,.23);
        }

        .scene-controls button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        .scene-controls button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        @keyframes personLook {
            0%,100% { transform: rotate(0); }
            45% { transform: rotate(5deg); }
        }

        @keyframes notificationPop {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media(max-width:600px) {
            .video-simulation {
                padding: 13px;
            }

            .animation-stage {
                min-height: 210px;
                padding: 13px;
                gap: 10px;
            }

            .animation-person {
                width: 60px;
                flex-basis: 60px;
                transform: scale(.78);
                transform-origin: center;
            }

            .animation-content p {
                font-size: 12px;
            }
        }
    </style>
</head>
