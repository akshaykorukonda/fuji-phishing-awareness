/* =====================================================

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[c]);
}

function updateProgress() {
    const total = QUESTIONS.length;
    const number = currentIndex + 1;

    document.getElementById("questionCounter").textContent =
        `Question ${number} of ${total}`;

    document.getElementById("progressPercent").textContent =
        `${Math.round(number / total * 100)}%`;

    document.getElementById("progressFill").style.width =
        `${number / total * 100}%`;
}

/* =====================================================

function addBox(w,h,d,color,x,y,z,options={}) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color,
            roughness: .7,
            metalness: .05,
            ...options
        })
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}

function addSphere(radius,color,x,y,z) {

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius,24,16),
        new THREE.MeshStandardMaterial({
            color,
            roughness: .55
        })
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}

function addCylinder(top,bottom,height,color,x,y,z) {

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(top,bottom,height,20),
        new THREE.MeshStandardMaterial({color})
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}


/* =====================================================
   3D FLOATING TEXT
===================================================== */

function addFloatingLabel(text,color,x,y,z) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "rgba(5,18,34,.94)";
    ctx.fillRect(0,0,512,128);

    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.strokeRect(4,4,504,120);

    ctx.fillStyle = color;
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(text).slice(0,27),256,64);

    const texture = new THREE.CanvasTexture(canvas);

    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        })
    );

    sprite.position.set(x,y,z);
    sprite.scale.set(3.2,.8,1);

    sprite.userData.dynamicLabel = true;

    scene.add(sprite);
    dynamicObjects.push(sprite);

    return sprite;
}

function clearSceneLabels() {

    dynamicObjects.forEach(object => {
        scene.remove(object);

        if (object.material && object.material.map) {
            object.material.map.dispose();
        }

        if (object.material) {
            object.material.dispose();
        }
    });

    dynamicObjects = [];
}


/* =====================================================
   3D SHIELD OBJECT
===================================================== */

function createShield() {

    const group = new THREE.Group();

    const shieldShape = new THREE.Shape();

    shieldShape.moveTo(0,.55);
    shieldShape.lineTo(.42,.35);
    shieldShape.lineTo(.36,-.15);
    shieldShape.lineTo(0,-.55);
    shieldShape.lineTo(-.36,-.15);
    shieldShape.lineTo(-.42,.35);
    shieldShape.closePath();

    const geometry = new THREE.ExtrudeGeometry(
        shieldShape,
        {
            depth:.12,
            bevelEnabled:true,
            bevelSegments:2,
            steps:1,
            bevelSize:.04,
            bevelThickness:.04
        }
    );

    const material = new THREE.MeshStandardMaterial({
        color:0x24d77b,
        emissive:0x087b42,
        emissiveIntensity:.7,
        metalness:.25,
        roughness:.3
    });

    const shield = new THREE.Mesh(geometry,material);
    shield.rotation.y = Math.PI;
    group.add(shield);

    // Check mark
    const check = new THREE.Group();

    const first = new THREE.Mesh(
        new THREE.BoxGeometry(.1,.32,.08),
        new THREE.MeshStandardMaterial({color:0xffffff})
    );

    first.rotation.z = -.75;
    first.position.set(-.1,-.02,.2);

    const second = new THREE.Mesh(
        new THREE.BoxGeometry(.1,.48,.08),
        new THREE.MeshStandardMaterial({color:0xffffff})
    );

    second.rotation.z = .75;
    second.position.set(.13,.04,.2);

    check.add(first,second);
    group.add(check);

    group.position.set(2.5,3.6,-1);
    group.scale.set(.9,.9,.9);

    scene.add(group);
    group.visible = false;

    return group;
}

/* =====================================================
   INITIALIZE THREE.JS
===================================================== */

function initialize3D() {

    if (!window.THREE) {
        document.getElementById("sceneStatus3D").textContent =
            "3D library unavailable";
        return false;
    }

    const canvas = document.getElementById("threeCanvas");
    const container = document.getElementById("sceneContainer");

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        48,
        container.clientWidth / container.clientHeight,
        .1,
        100
    );

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);

    try {
        renderer = new THREE.WebGLRenderer({
            canvas,
            antialias:true,
            alpha:false
        });
    } catch (error) {
        document.getElementById("sceneStatus3D").textContent =
            "WebGL unavailable";
        return false;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    clock = new THREE.Clock();

    buildOffice();

    window.addEventListener("resize",resize3D);

    threeReady = true;

    animate3D();

    return true;
}

function resize3D() {

    if (!renderer || !camera) return;

    const container = document.getElementById("sceneContainer");

    camera.aspect =
        container.clientWidth / container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );
}


/* =====================================================
   3D ANIMATION LOOP
===================================================== */

function animate3D() {

    animationFrame = requestAnimationFrame(animate3D);

    const time = clock ? clock.getElapsedTime() : 0;

    if (character) {
        character.position.y = Math.sin(time*1.5)*.025;
    }

    particles.forEach((particle,i) => {
        particle.position.y += Math.sin(time+i)*.001;
        particle.rotation.y += .005;
    });

    if (emailPanel && emailPanel.visible) {
        emailPanel.position.y = 3.3 + Math.sin(time*2)*.06;
    }

    if (alertObject && alertObject.visible) {
        const pulse = 1 + Math.sin(time*5)*.13;
        alertObject.scale.setScalar(pulse);
        alertObject.rotation.y += .025;
    }

    if (shieldObject && shieldObject.visible) {
        shieldObject.rotation.y = Math.sin(time)*.18;
        shieldObject.position.y = 3.6 + Math.sin(time*2)*.08;
    }

    if (renderer && scene && camera) {
        renderer.render(scene,camera);
    }
}


/* =====================================================
   RESET 3D SCENE
===================================================== */

function reset3DScene() {

    if (!threeReady) return;

    clearSceneLabels();

    emailPanel.visible = true;
    alertObject.visible = false;
    shieldObject.visible = false;

    monitorScreen.material.color.set(0x14557b);
    monitorScreen.material.emissive.set(0x0b3855);

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);
}


/* =====================================================
   DISPLAY SCENE TEXT
===================================================== */

function setSceneText(kicker,title,description,caption) {

    document.getElementById("sceneKicker").textContent = kicker;
    document.getElementById("sceneTitle").textContent = title;
    document.getElementById("sceneDescription").textContent = description;
    document.getElementById("sceneCaption").textContent = caption;
}


/* =====================================================
   OPENING ANIMATION FOR EACH QUESTION
===================================================== */

function showIntroScene() {

    clearInterval(introTimer);
    clearInterval(outcomeTimer);

    currentPhase = "intro";
    introRunning = true;
    outcomeRunning = false;
    introElapsed = 0;

    const s = SCENARIOS[currentIndex];

    questionCard.style.display = "none";
    scenarioCard.style.display = "block";

    if (!threeReady && !initialize3D()) {
        document.getElementById("sceneDescription").textContent =
            "The 3D scene could not be loaded. Check your browser's WebGL support and internet connection.";
        return;
    }

    reset3DScene();

    setSceneText(
        "INCIDENT PREVIEW / QUESTION " + (currentIndex+1),
        s.introTitle,
        s.intro,
        "Watch the incident carefully. The question will appear after this opening scene."
    );

    document.getElementById("sceneStatus3D").textContent = "NEW INCIDENT";
    document.getElementById("scenarioTimer").textContent = "Opening scene";
    document.getElementById("scenarioStatus").textContent =
        "Opening animation playing...";

    document.getElementById("sceneProgressFill").style.width = "0%";

    introTimer = setInterval(() => {

        introElapsed++;

        document.getElementById("sceneProgressFill").style.width =
            `${introElapsed/8*100}%`;

        if (introElapsed === 2) {

            clearSceneLabels();

            addFloatingLabel(
                "NEW EMAIL RECEIVED",
                "#83d8ff",
                0,4.35,-.65
            );

            document.getElementById("sceneStatus3D").textContent =
                "NEW EMAIL";
        }

        if (introElapsed === 5) {

            clearSceneLabels();

            addFloatingLabel(
                "EMPLOYEE INSPECTING",
                "#ffffff",
                0,4.35,-.65
            );

            document.getElementById("sceneStatus3D").textContent =
                "UNDER REVIEW";

            camera.position.set(4,4.2,7);
            camera.lookAt(0,2.8,-.5);
        }

        if (introElapsed >= 8) {

            clearInterval(introTimer);

            introRunning = false;

            scenarioCard.style.display = "none";
            questionCard.style.display = "block";

            document.getElementById("scenarioStatus").textContent =
                "Opening scene completed.";

        }

    },1000);
}


/* =====================================================
   CORRECT ANSWER OUTCOME
===================================================== */

function playCorrectOutcome(s) {

    reset3DScene();

    monitorScreen.material.color.set(0x087b50);
    monitorScreen.material.emissive.set(0x075d3e);

    alertObject.material.color.set(0x36e68a);
    alertObject.visible = true;

    shieldObject.visible = true;

    addFloatingLabel(
        s.correctLabel,
        "#7dffb1",
        0,4.35,-.65
    );

    camera.position.set(7,5.5,9);
    camera.lookAt(0,2,0);

    document.getElementById("sceneStatus3D").textContent =
        s.safe;
}


/* =====================================================
   INCORRECT ANSWER OUTCOME
===================================================== */

function playWrongOutcome(s) {

    reset3DScene();

    monitorScreen.material.color.set(0x9b2424);
    monitorScreen.material.emissive.set(0x681010);

    alertObject.material.color.set(0xff2929);
    alertObject.visible = true;

    shieldObject.visible = false;

    addFloatingLabel(
        s.wrongLabel,
        "#ff7777",
        0,4.35,-.65
    );

    camera.position.set(3,4,6);
    camera.lookAt(0,2.7,-.5);

    document.getElementById("sceneStatus3D").textContent =
        s.unsafe;
}


/* =====================================================
   ANSWER OUTCOME ANIMATION
===================================================== */

function showOutcomeScene(selectedIndex) {

    clearInterval(introTimer);
    clearInterval(outcomeTimer);

    currentPhase = "outcome";
    introRunning = false;
    outcomeRunning = true;
    outcomeElapsed = 0;

    const q = QUESTIONS[currentIndex];
    const s = SCENARIOS[currentIndex];

    const isCorrect =
        Number(selectedIndex) === Number(q.correct);

    questionCard.style.display = "none";
    scenarioCard.style.display = "block";

    reset3DScene();

    if (isCorrect) {

        setSceneText(
            "CORRECT DECISION / POSITIVE OUTCOME",
            s.correctTitle,
            s.correct,
            "The employee followed the safer security practice."
        );

        playCorrectOutcome(s);

    } else {

        setSceneText(
            "INCORRECT DECISION / SECURITY INCIDENT",
            s.wrongTitle,
            s.wrong,
            "This simulated incident demonstrates what could happen after an unsafe decision."
        );

        playWrongOutcome(s);

    }

    document.getElementById("scenarioTimer").textContent =
        "Outcome simulation";

    document.getElementById("scenarioStatus").textContent =
        "Playing answer outcome...";

    document.getElementById("sceneProgressFill").style.width = "0%";

    outcomeTimer = setInterval(() => {

        outcomeElapsed++;

        document.getElementById("sceneProgressFill").style.width =
            `${outcomeElapsed/12*100}%`;

        if (outcomeElapsed === 4) {

            clearSceneLabels();

            addFloatingLabel(
                isCorrect ? "THREAT BLOCKED" : "INCIDENT DETECTED",
                isCorrect ? "#7dffb1" : "#ff7777",
                0,4.35,-.65
            );

            document.getElementById("sceneStatus3D").textContent =
                isCorrect ? "THREAT BLOCKED" : "INCIDENT DETECTED";
        }

        if (outcomeElapsed === 8) {

            clearSceneLabels();

            addFloatingLabel(
                isCorrect ? "EMPLOYEE PROTECTED" : "SECURITY RESPONSE",
                isCorrect ? "#7dffb1" : "#ff7777",
                0,4.35,-.65
            );
        }

        if (outcomeElapsed >= 12) {

            clearInterval(outcomeTimer);

            outcomeRunning = false;

            scenarioCard.style.display = "none";
            questionCard.style.display = "block";

            showAnswerFeedback(selectedIndex);

            continueButton.disabled = false;

            continueButton.textContent =
                currentIndex === QUESTIONS.length-1
                    ? "Submit Assessment"
                    : "Continue";

            document.getElementById("scenarioStatus").textContent =
                "Outcome completed.";
        }

    },1000);
}


/* =====================================================
   REPLAY AND SKIP
===================================================== */

function replayScene() {

    if (currentPhase === "intro") {
        showIntroScene();
        return;
    }

    if (currentPhase === "outcome" &&
        selectedAnswers[currentIndex] !== undefined) {

        showOutcomeScene(selectedAnswers[currentIndex]);
    }
}

function skipScene() {

    if (currentPhase === "intro" && introRunning) {

        clearInterval(introTimer);
        introRunning = false;

        scenarioCard.style.display = "none";
        questionCard.style.display = "block";

        document.getElementById("scenarioStatus").textContent =
            "Opening scene skipped.";

        return;
    }

    if (currentPhase === "outcome" && outcomeRunning) {

        clearInterval(outcomeTimer);
        outcomeRunning = false;

        scenarioCard.style.display = "none";
        questionCard.style.display = "block";

        showAnswerFeedback(selectedAnswers[currentIndex]);

        continueButton.disabled = false;

        continueButton.textContent =
            currentIndex === QUESTIONS.length-1
                ? "Submit Assessment"
                : "Continue";

        document.getElementById("scenarioStatus").textContent =
            "Outcome skipped.";

    }
}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion() {

    clearInterval(introTimer);
    clearInterval(outcomeTimer);

    answerLocked = false;

    const q = QUESTIONS[currentIndex];

    selectedAnswers[currentIndex] = undefined;

    questionCard.style.display = "none";
    scenarioCard.style.display = "none";

    updateProgress();

    document.getElementById("questionCategory").textContent =
        q.category || "PHISHING INVESTIGATION";

    document.getElementById("questionTitle").textContent =
        q.title || `Question ${currentIndex+1}`;

    document.getElementById("questionDescription").textContent =
        q.scenario || "";

    document.getElementById("emailNote").textContent =
        q.email_note || "";

    const emailArea = document.getElementById("emailArea");

    if (q.comparison && Array.isArray(q.emails)) {

        emailArea.innerHTML =
            `<div class="email-grid">
                ${q.emails.map(renderEmail).join("")}
            </div>`;

    } else {

        const email = {
            label:"EMAIL DETAILS",
            sender:q.sender,
            sender_email:q.sender_email,
            timestamp:q.timestamp,
            subject:q.subject,
            body:q.scenario,
            link:q.display_link,
            attachment:q.attachment
        };

        emailArea.innerHTML =
            `<div class="email-grid">
                ${renderEmail(email)}
            </div>`;
    }

    const optionsArea = document.getElementById("optionsArea");

    optionsArea.innerHTML = "";

    (q.options || []).forEach((option,index) => {

        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");

        input.type = "radio";
        input.name = "answer";
        input.value = index;

        const span = document.createElement("span");
        span.textContent = option;

        input.addEventListener("change",() => {

            if (answerLocked) return;

            answerLocked = true;

            selectedAnswers[currentIndex] = index;

            // Lock the answer after selection.
            document.querySelectorAll(
                'input[name="answer"]'
            ).forEach(radio => {
                radio.disabled = true;
            });

            document.querySelectorAll(".option").forEach(item => {
                item.classList.add("locked");
            });

            continueButton.disabled = true;

            showAnswerFeedback(index);

            // Play the selected answer's unique 3D outcome.
            showOutcomeScene(index);
        });

        label.append(input,span);

        optionsArea.appendChild(label);
    });

    const feedback = document.getElementById("answerFeedback");

    feedback.className = "answer-feedback";
    feedback.textContent = "";

    continueButton.disabled = true;

    continueButton.textContent =
        currentIndex === QUESTIONS.length-1
            ? "Submit Assessment"
            : "Continue";

    // Opening 3D animation automatically starts for every question.
    showIntroScene();
}


/* =====================================================
   SHOW ANSWER AND EXPLANATION
===================================================== */

function showAnswerFeedback(selectedIndex) {

    const q = QUESTIONS[currentIndex];

    const feedback = document.getElementById("answerFeedback");

    const isCorrect =
        Number(selectedIndex) === Number(q.correct);

    document.querySelectorAll(".option").forEach((option,index) => {

        option.classList.remove("correct","wrong");

        if (index === Number(q.correct)) {
            option.classList.add("correct");
        }

        if (
            index === Number(selectedIndex) &&
            index !== Number(q.correct)
        ) {
            option.classList.add("wrong");
        }

    });

    feedback.className =
        "answer-feedback " + (isCorrect ? "correct" : "wrong");

    feedback.innerHTML = `
        <strong>
            ${isCorrect ? "Correct response" : "Incorrect response"}
        </strong>
        <br>
        ${escapeHTML(q.explanation || "")}
    `;
}


/* =====================================================
   CONTINUE TO NEXT QUESTION
===================================================== */

function proceed() {

    if (selectedAnswers[currentIndex] === undefined) return;

    if (currentIndex === QUESTIONS.length-1) {
        submitAssessment();
        return;
    }

    currentIndex++;

    renderQuestion();
}


/* =====================================================
   SUBMIT ASSESSMENT TO FLASK
===================================================== */

async function submitAssessment() {

    clearInterval(introTimer);
    clearInterval(outcomeTimer);

    continueButton.disabled = true;

    try {

        const response = await fetch("/submit", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                attempt_id:ATTEMPT_ID,
                answers:selectedAnswers
            })

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Submission failed.");
        }

        if (result.url) {

            window.location.href = result.url;

        } else {

            throw new Error("Results URL was not returned.");

        }

    } catch(error) {

        alert(error.message || "Unable to submit assessment.");

        continueButton.disabled = false;
    }
}


/* =====================================================
   BUTTON EVENTS
===================================================== */

continueButton.addEventListener("click",proceed);

document.getElementById("replayButton")
    .addEventListener("click",replayScene);

document.getElementById("skipButton")
    .addEventListener("click",skipScene);


/* =====================================================
   START QUIZ
===================================================== */

if (Array.isArray(QUESTIONS) && QUESTIONS.length > 0) {

    renderQuestion();

} else {

    questionCard.style.display = "block";

    questionCard.innerHTML =
        "<h2>No questions available. Contact the administrator.</h2>";

}

</script>
